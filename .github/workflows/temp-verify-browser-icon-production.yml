name: Temporary Read-only Production Browser Icon Verification

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: read

jobs:
  verify-production-icon:
    name: Verify deployed release and browser icon read-only
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      BASE_URL: https://fanmind.ch
      EXPECTED_COMMIT: 9c5e4d3c24a90e13e0448ea1394639854758f673
      ICON_REVISION: fanmind-round-social-20260725

    steps:
      - name: Wait for the exact merged release without changing Production
        shell: bash
        run: |
          set -euo pipefail
          matched=false
          for attempt in $(seq 1 60); do
            if curl -fsS --max-time 15 \
              -H 'Cache-Control: no-cache' \
              "$BASE_URL/api/version?verify=$GITHUB_RUN_ID-$attempt" \
              -o /tmp/fanmind-version.json; then
              live_commit="$(python3 - <<'PY'
          import json
          from pathlib import Path
          try:
              payload = json.loads(Path('/tmp/fanmind-version.json').read_text(encoding='utf-8'))
          except Exception:
              print('')
          else:
              value = payload.get('releaseCommit', '')
              print(value if isinstance(value, str) else '')
          PY
              )"
              if [ "$live_commit" = "$EXPECTED_COMMIT" ]; then
                matched=true
                echo "Expected browser-icon release is active."
                break
              fi
            fi
            echo "Production is not yet on the expected release (attempt ${attempt}/60)."
            sleep 15
          done

          if [ "$matched" != "true" ]; then
            echo "Expected release was not observed inside the bounded wait window." >&2
            exit 1
          fi

      - name: Fetch public HTML and icon using cache-busting GET requests
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --max-time 30 \
            -H 'Cache-Control: no-cache' \
            "$BASE_URL/?verify=$GITHUB_RUN_ID" \
            -o /tmp/fanmind-landing.html
          curl -fsSL --max-time 30 \
            -H 'Cache-Control: no-cache' \
            -D /tmp/fanmind-icon-headers.txt \
            "$BASE_URL/icon?v=$ICON_REVISION&verify=$GITHUB_RUN_ID" \
            -o /tmp/fanmind-icon.png

      - name: Verify release, metadata and PNG contract
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p verification
          python3 - <<'PY'
          import html as html_module
          import json
          import os
          import re
          from html.parser import HTMLParser
          from pathlib import Path
          from urllib.parse import parse_qs, urlparse

          expected_commit = os.environ['EXPECTED_COMMIT']
          icon_revision = os.environ['ICON_REVISION']
          version = json.loads(Path('/tmp/fanmind-version.json').read_text(encoding='utf-8'))
          html = Path('/tmp/fanmind-landing.html').read_text(encoding='utf-8', errors='strict')
          headers = Path('/tmp/fanmind-icon-headers.txt').read_text(encoding='utf-8', errors='replace')
          icon = Path('/tmp/fanmind-icon.png').read_bytes()

          class IconLinkParser(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=True)
                  self.icon_hrefs = []

              def handle_starttag(self, tag, attrs):
                  if tag.lower() != 'link':
                      return
                  values = {key.lower(): value or '' for key, value in attrs}
                  rel_tokens = {token.lower() for token in values.get('rel', '').split()}
                  if 'icon' in rel_tokens:
                      href = html_module.unescape(values.get('href', '')).strip()
                      if href:
                          self.icon_hrefs.append(href)

          parser = IconLinkParser()
          parser.feed(html)

          def is_expected_icon_href(href):
              parsed = urlparse(href)
              return parsed.path.endswith('/icon') and parse_qs(parsed.query).get('v') == [icon_revision]

          release_matches = version.get('releaseCommit') == expected_commit
          expected_icon_href_present = any(is_expected_icon_href(href) for href in parser.icon_hrefs)
          obsolete_favicon_href_present = any('/favicon.ico' in href for href in parser.icon_hrefs)
          png_signature_valid = icon[:8] == bytes([137, 80, 78, 71, 13, 10, 26, 10])
          width = int.from_bytes(icon[16:20], 'big') if len(icon) >= 24 else 0
          height = int.from_bytes(icon[20:24], 'big') if len(icon) >= 24 else 0
          dimensions_valid = (width, height) == (96, 96)
          content_type_valid = bool(
              re.search(r'(?im)^content-type:\s*image/png(?:;|\s|$)', headers)
          )

          report = {
              'expected_release_commit': expected_commit,
              'live_release_commit': version.get('releaseCommit'),
              'live_release_matches': release_matches,
              'icon_link_count': len(parser.icon_hrefs),
              'icon_hrefs': parser.icon_hrefs,
              'cache_busted_icon_href_present': expected_icon_href_present,
              'obsolete_favicon_href_present': obsolete_favicon_href_present,
              'png_signature_valid': png_signature_valid,
              'icon_content_type_valid': content_type_valid,
              'icon_width': width,
              'icon_height': height,
              'icon_dimensions_valid': dimensions_valid,
              'production_requests': 'GET only',
              'production_data_mutated': False,
          }
          Path('verification/production-browser-icon-report.json').write_text(
              json.dumps(report, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          print(json.dumps(report, indent=2, sort_keys=True))

          failures = []
          if not release_matches:
              failures.append('release_commit_mismatch')
          if not expected_icon_href_present:
              failures.append('cache_busted_icon_href_missing')
          if obsolete_favicon_href_present:
              failures.append('obsolete_favicon_href_present')
          if not png_signature_valid:
              failures.append('icon_is_not_png')
          if not dimensions_valid:
              failures.append(f'icon_dimensions_invalid:{width}x{height}')
          if not content_type_valid:
              failures.append('icon_content_type_invalid')

          if failures:
              raise SystemExit(';'.join(failures))

          print('Production browser icon verified read-only.')
          PY

      - name: Upload redacted production verification report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fanmind-production-browser-icon-verification
          path: verification/production-browser-icon-report.json
          if-no-files-found: warn
          include-hidden-files: false
          retention-days: 7
