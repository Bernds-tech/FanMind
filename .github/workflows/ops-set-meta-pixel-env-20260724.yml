name: FanMind P1 Set Meta Pixel Production Env

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
    paths:
      - ".github/workflows/ops-set-meta-pixel-env-20260724.yml"

concurrency:
  group: fanmind-p1-set-meta-pixel-env-20260724
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  update:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'ops/set-meta-pixel-env-20260724'
    runs-on:
      - self-hosted
      - fanmind-prod
      - exoscale
      - linux
      - x64
    timeout-minutes: 15
    env:
      EXPECTED_RELEASE: 0292750f4f69633923a9081dbbe3613f6e6301ea
      REPORT_PATH: fanmind-meta-pixel-env-update.txt

    steps:
      - name: Checkout trusted operations branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ops/set-meta-pixel-env-20260724
          fetch-depth: 1
          show-progress: false

      - name: Verify exact current Production release and health
        shell: bash
        run: |
          set -euo pipefail
          report="$GITHUB_WORKSPACE/$REPORT_PATH"
          : > "$report"
          printf 'ENV_UPDATE_UTC=%s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" | tee -a "$report"
          printf 'EXPECTED_RELEASE=%s\n' "$EXPECTED_RELEASE" | tee -a "$report"

          live_release="$(curl -fsSL --max-time 15 https://fanmind.ch/api/version | node -e '
            let input="";
            process.stdin.on("data", chunk => input += chunk);
            process.stdin.on("end", () => {
              try {
                const payload = JSON.parse(input);
                process.stdout.write(typeof payload.releaseCommit === "string" ? payload.releaseCommit : "missing");
              } catch {
                process.stdout.write("missing");
              }
            });
          ')"
          server_head="$(git -C /var/www/fanmind rev-parse HEAD)"
          origin_main="$(git -C /var/www/fanmind rev-parse origin/main)"
          test "$live_release" = "$EXPECTED_RELEASE"
          test "$server_head" = "$EXPECTED_RELEASE"
          test "$origin_main" = "$EXPECTED_RELEASE"

          curl -fsSL --max-time 15 https://fanmind.ch/api/health | node -e '
            let input="";
            process.stdin.on("data", chunk => input += chunk);
            process.stdin.on("end", () => {
              const payload = JSON.parse(input);
              const components = Object.values(payload.components || {});
              process.exit(
                payload.status === "healthy" &&
                components.every(item => item?.status === "healthy")
                  ? 0
                  : 1,
              );
            });
          '

          pm2 jlist | node -e '
            let input="";
            process.stdin.on("data", chunk => input += chunk);
            process.stdin.on("end", () => {
              const apps = JSON.parse(input);
              const app = apps.find(item => item?.name === "fanmind");
              if (!app || app?.pm2_env?.status !== "online") process.exit(1);
              const snapshot = {
                pid: Number(app.pid || 0),
                restarts: Number(app?.pm2_env?.restart_time || 0),
              };
              require("node:fs").writeFileSync(
                process.env.RUNNER_TEMP + "/fanmind-meta-env-pm2-before.json",
                JSON.stringify(snapshot),
                { mode: 0o600 },
              );
            });
          '

          echo 'PRE_UPDATE_RELEASE_SYNC=ok' | tee -a "$report"
          echo 'PRE_UPDATE_PUBLIC_HEALTH=healthy' | tee -a "$report"
          echo 'PRE_UPDATE_PM2=online' | tee -a "$report"

      - name: Set exact public Meta Pixel ID atomically without exposing ENV values
        shell: bash
        run: |
          set -euo pipefail
          report="$GITHUB_WORKSPACE/$REPORT_PATH"

          sudo -n env REPORT_PATH="$report" /usr/bin/node --input-type=module <<'NODE'
          import { appendFile, chmod, chown, readFile, rename, stat, writeFile } from 'node:fs/promises';

          const file = '/var/www/fanmind/.env.production';
          const expected = '2069553844439892';
          const keyPattern = /^\s*NEXT_PUBLIC_META_PIXEL_ID\s*=/;
          const metadata = await stat(file);
          const source = await readFile(file, 'utf8');
          const lines = source.split(/\r?\n/);
          const matches = lines.filter(line => keyPattern.test(line));
          const exactBefore = matches.length === 1
            && matches[0].slice(matches[0].indexOf('=') + 1).trim().replace(/^(["'])(.*)\1$/, '$2') === expected;
          const status = exactBefore ? 'preserved' : matches.length === 0 ? 'created' : 'replaced';

          if (!exactBefore) {
            const retained = lines.filter(line => !keyPattern.test(line));
            while (retained.length && retained.at(-1) === '') retained.pop();
            const updated = `${retained.join('\n')}\nNEXT_PUBLIC_META_PIXEL_ID=${expected}\n`;
            const temporary = `${file}.meta-pixel-${process.pid}.tmp`;
            await writeFile(temporary, updated, { mode: metadata.mode & 0o777 });
            await chmod(temporary, metadata.mode & 0o777);
            await chown(temporary, metadata.uid, metadata.gid);
            await rename(temporary, file);
          }

          const verified = (await readFile(file, 'utf8'))
            .split(/\r?\n/)
            .filter(line => keyPattern.test(line));
          if (verified.length !== 1) throw new Error('meta_pixel_env_key_count_invalid');
          const value = verified[0]
            .slice(verified[0].indexOf('=') + 1)
            .trim()
            .replace(/^(["'])(.*)\1$/, '$2');
          if (value !== expected) throw new Error('meta_pixel_env_value_invalid');

          const reportPath = process.env.REPORT_PATH;
          if (!reportPath) throw new Error('report_path_missing');
          const output = [
            `META_PIXEL_ENV_UPDATE=${status}`,
            'META_PIXEL_ENV_KEY_COUNT=1',
            'META_PIXEL_ENV_EXACT_MATCH=yes',
            'OTHER_ENV_VALUES_WERE_NOT_PRINTED=true',
            'APPLICATION_RESTART_REQUESTED=false',
          ];
          await appendFile(reportPath, `${output.join('\n')}\n`, { mode: 0o644 });
          process.stdout.write(`${output.join('\n')}\n`);
          NODE

      - name: Confirm no process restart and unchanged public health
        shell: bash
        run: |
          set -euo pipefail
          report="$GITHUB_WORKSPACE/$REPORT_PATH"

          pm2 jlist | node -e '
            let input="";
            process.stdin.on("data", chunk => input += chunk);
            process.stdin.on("end", () => {
              const fs = require("node:fs");
              const before = JSON.parse(
                fs.readFileSync(process.env.RUNNER_TEMP + "/fanmind-meta-env-pm2-before.json", "utf8"),
              );
              const apps = JSON.parse(input);
              const app = apps.find(item => item?.name === "fanmind");
              if (!app || app?.pm2_env?.status !== "online") process.exit(1);
              const unchanged =
                Number(app.pid || 0) === before.pid &&
                Number(app?.pm2_env?.restart_time || 0) === before.restarts;
              process.exit(unchanged ? 0 : 1);
            });
          '

          curl -fsSL --max-time 15 https://fanmind.ch/api/health | node -e '
            let input="";
            process.stdin.on("data", chunk => input += chunk);
            process.stdin.on("end", () => {
              const payload = JSON.parse(input);
              const components = Object.values(payload.components || {});
              process.exit(
                payload.status === "healthy" &&
                components.every(item => item?.status === "healthy")
                  ? 0
                  : 1,
              );
            });
          '

          echo 'POST_UPDATE_PM2_PID_AND_RESTARTS=unchanged' | tee -a "$report"
          echo 'POST_UPDATE_PUBLIC_HEALTH=healthy' | tee -a "$report"
          echo 'META_PIXEL_ENV_UPDATE_RESULT=success' | tee -a "$report"

      - name: Upload sanitized environment update evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fanmind-meta-pixel-env-update
          path: fanmind-meta-pixel-env-update.txt
          if-no-files-found: error
          retention-days: 7
