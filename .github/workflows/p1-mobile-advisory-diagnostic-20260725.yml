name: FanMind P1 Mobile High Advisory Diagnostic

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
    paths:
      - ".github/workflows/p1-mobile-advisory-diagnostic-20260725.yml"

concurrency:
  group: fanmind-p1-mobile-high-advisory-diagnostic-20260725
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  diagnose:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'p1/mobile-high-advisory-20260725'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      REPORT_PATH: fanmind-mobile-high-advisory-diagnostic.json
    steps:
      - name: Checkout trusted diagnostic branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: p1/mobile-high-advisory-20260725
          fetch-depth: 1
          show-progress: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json

      - name: Install Mobile dependencies reproducibly
        run: npm ci --prefix apps/mobile --no-audit --no-fund

      - name: Resolve high and critical advisory package paths without mutation
        shell: bash
        run: |
          set -euo pipefail
          set +e
          npm audit --prefix apps/mobile --json > "$RUNNER_TEMP/mobile-audit.json"
          audit_status=$?
          set -e

          AUDIT_STATUS="$audit_status" node <<'NODE'
          const fs = require('node:fs');
          const cp = require('node:child_process');
          const audit = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/mobile-audit.json', 'utf8'));
          const vulnerabilities = audit && typeof audit.vulnerabilities === 'object' && audit.vulnerabilities
            ? audit.vulnerabilities
            : {};
          const affected = Object.entries(vulnerabilities)
            .filter(([, value]) => ['high', 'critical'].includes(String(value?.severity || '')))
            .sort(([left], [right]) => left.localeCompare(right));

          function explainPackage(name) {
            const result = cp.spawnSync('npm', ['explain', '--prefix', 'apps/mobile', '--json', name], {
              encoding: 'utf8',
              maxBuffer: 8 * 1024 * 1024,
            });
            if (result.status !== 0 || !result.stdout.trim()) return [];
            let rows;
            try { rows = JSON.parse(result.stdout); } catch { return []; }
            if (!Array.isArray(rows)) rows = [rows];
            return rows.slice(0, 30).map((row) => ({
              name: String(row?.name || name),
              version: String(row?.version || ''),
              location: String(row?.location || '').replace(/^node_modules\//u, ''),
              dependents: Array.isArray(row?.dependents)
                ? row.dependents.slice(0, 20).map((dependent) => ({
                    name: String(dependent?.name || ''),
                    version: String(dependent?.version || ''),
                    type: String(dependent?.type || ''),
                  }))
                : [],
            }));
          }

          function normalizeFix(value) {
            if (value === true || value === false || value == null) return value ?? null;
            return {
              name: String(value.name || ''),
              version: String(value.version || ''),
              isSemVerMajor: Boolean(value.isSemVerMajor),
            };
          }

          const report = {
            generatedAt: new Date().toISOString(),
            auditExitStatus: Number(process.env.AUDIT_STATUS || 0),
            counts: audit?.metadata?.vulnerabilities || null,
            affected: affected.map(([name, value]) => ({
              name,
              severity: String(value?.severity || ''),
              isDirect: Boolean(value?.isDirect),
              range: String(value?.range || ''),
              nodeCount: Array.isArray(value?.nodes) ? value.nodes.length : 0,
              fixAvailable: normalizeFix(value?.fixAvailable),
              viaPackages: Array.isArray(value?.via)
                ? [...new Set(value.via.filter((item) => typeof item === 'string'))].sort()
                : [],
              advisorySourceIds: Array.isArray(value?.via)
                ? value.via
                    .filter((item) => item && typeof item === 'object' && Number.isInteger(item.source))
                    .map((item) => item.source)
                    .sort((a, b) => a - b)
                : [],
              dependencyPaths: explainPackage(name),
            })),
            advisoryBodiesIncluded: false,
            advisoryUrlsIncluded: false,
            environmentValuesRead: false,
          };
          fs.writeFileSync(process.env.REPORT_PATH, JSON.stringify(report, null, 2) + '\n', { mode: 0o600 });
          console.log(`MOBILE_AUDIT_HIGH=${Number(report.counts?.high || 0)}`);
          console.log(`MOBILE_AUDIT_CRITICAL=${Number(report.counts?.critical || 0)}`);
          console.log(`MOBILE_AFFECTED_PACKAGE_COUNT=${report.affected.length}`);
          for (const item of report.affected) {
            console.log(`MOBILE_AFFECTED_PACKAGE=${item.name}`);
            console.log(`MOBILE_AFFECTED_SEVERITY=${item.severity}`);
            console.log(`MOBILE_AFFECTED_DIRECT=${item.isDirect}`);
            console.log(`MOBILE_AFFECTED_FIX=${JSON.stringify(item.fixAvailable)}`);
          }
          NODE

          rm -f "$RUNNER_TEMP/mobile-audit.json"
          test -s "$REPORT_PATH"

      - name: Upload sanitized diagnostic evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fanmind-mobile-high-advisory-diagnostic
          path: fanmind-mobile-high-advisory-diagnostic.json
          if-no-files-found: error
          retention-days: 7
