name: FanMind P1 Production AI ENV Audit

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
    paths:
      - ".github/workflows/ops-production-ai-env-audit-20260724.yml"

concurrency:
  group: fanmind-p1-production-ai-env-audit-20260724
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  audit:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'ops/controlled-ubuntu-reboot-20260724'
    runs-on:
      - self-hosted
      - fanmind-prod
      - exoscale
      - linux
      - x64
    timeout-minutes: 10
    env:
      EXPECTED_RELEASE: 6b8ba61a1786651713b2507340dc7b673811159d
      REPORT_PATH: fanmind-production-ai-env-audit.txt

    steps:
      - name: Checkout trusted operations branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ops/controlled-ubuntu-reboot-20260724
          fetch-depth: 1
          show-progress: false

      - name: Verify exact release and redacted environment contract
        shell: bash
        run: |
          set -euo pipefail
          report="$GITHUB_WORKSPACE/$REPORT_PATH"
          : > "$report"
          printf 'AI_ENV_AUDIT_UTC=%s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" | tee -a "$report"
          printf 'EXPECTED_RELEASE=%s\n' "$EXPECTED_RELEASE" | tee -a "$report"

          live_release="$(curl -fsSL --max-time 15 https://fanmind.ch/api/version | node -e '
            let input="";
            process.stdin.on("data", chunk => input += chunk);
            process.stdin.on("end", () => process.stdout.write(JSON.parse(input).releaseCommit || "missing"));
          ')"
          test "$live_release" = "$EXPECTED_RELEASE"
          test "$(git -C /var/www/fanmind rev-parse HEAD)" = "$EXPECTED_RELEASE"
          test "$(git -C /var/www/fanmind rev-parse origin/main)" = "$EXPECTED_RELEASE"

          sudo -n env ENV_FILE=/var/www/fanmind/.env.production /usr/bin/node --input-type=module <<'NODE' | tee -a "$report"
          import { readFileSync } from 'node:fs';

          const source = readFileSync(process.env.ENV_FILE, 'utf8');
          const rows = new Map();
          const counts = new Map();
          for (const rawLine of source.split(/\r?\n/u)) {
            const line = rawLine.trim();
            if (!line || line.startsWith('#') || !line.includes('=')) continue;
            const separator = line.indexOf('=');
            const key = line.slice(0, separator).trim();
            let value = line.slice(separator + 1).trim();
            if (
              value.length >= 2 &&
              ((value.startsWith('"') && value.endsWith('"')) ||
                (value.startsWith("'") && value.endsWith("'")))
            ) {
              value = value.slice(1, -1);
            }
            counts.set(key, (counts.get(key) || 0) + 1);
            rows.set(key, value);
          }

          const exactOne = key => counts.get(key) === 1;
          const nonPlaceholder = key => {
            const value = String(rows.get(key) || '');
            return exactOne(key)
              && value.length > 0
              && !/[\r\n\0]/u.test(value)
              && !/replace|placeholder|example|your_/iu.test(value);
          };
          const positiveNumber = key => {
            const value = String(rows.get(key) || '');
            return exactOne(key)
              && /^[0-9]+(?:\.[0-9]+)?$/u.test(value)
              && Number(value) > 0;
          };

          const checks = {
            FANMIND_ENABLE_TELEGRAM_SEND:
              exactOne('FANMIND_ENABLE_TELEGRAM_SEND') &&
              rows.get('FANMIND_ENABLE_TELEGRAM_SEND') === 'false',
            FANMIND_AI_MODEL: nonPlaceholder('FANMIND_AI_MODEL'),
            FANMIND_AI_PRICE_INPUT_PER_MILLION_CENTS:
              positiveNumber('FANMIND_AI_PRICE_INPUT_PER_MILLION_CENTS'),
            FANMIND_AI_PRICE_OUTPUT_PER_MILLION_CENTS:
              positiveNumber('FANMIND_AI_PRICE_OUTPUT_PER_MILLION_CENTS'),
            FANMIND_AI_USAGE_CURRENCY:
              exactOne('FANMIND_AI_USAGE_CURRENCY') &&
              rows.get('FANMIND_AI_USAGE_CURRENCY') === 'USD',
          };
          for (const [key, ok] of Object.entries(checks)) {
            console.log(`${key}=${ok ? 'valid' : 'invalid_or_missing'}`);
          }
          console.log('ENV_VALUES_PRINTED=false');
          console.log(`PRODUCTION_AI_ENV_RESULT=${Object.values(checks).every(Boolean) ? 'success' : 'failed'}`);
          if (!Object.values(checks).every(Boolean)) process.exit(1);
          NODE

          curl -fsSL --max-time 15 https://fanmind.ch/api/health | node -e '
            let input="";
            process.stdin.on("data", chunk => input += chunk);
            process.stdin.on("end", () => {
              const payload = JSON.parse(input);
              const checks = Array.isArray(payload.checks) ? payload.checks : [];
              process.exit(
                payload.status === "healthy" &&
                checks.length >= 7 &&
                checks.every(item => item?.status === "healthy")
                  ? 0
                  : 1,
              );
            });
          '
          echo 'PUBLIC_HEALTH_AFTER_ENV_AUDIT=healthy' | tee -a "$report"

      - name: Upload sanitized environment evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fanmind-production-ai-env-audit
          path: fanmind-production-ai-env-audit.txt
          if-no-files-found: error
          retention-days: 7
