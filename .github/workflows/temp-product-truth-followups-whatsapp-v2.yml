name: Temporary Follow-ups and WhatsApp Product Truth v2

on:
  push:
    branches:
      - p1/product-truth-followups-whatsapp-20260725
    paths:
      - .github/workflows/temp-product-truth-followups-whatsapp-v2.yml
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: write

jobs:
  patch-product-truth:
    name: Apply product-truth patch and self-clean
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout target branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: p1/product-truth-followups-whatsapp-20260725
          fetch-depth: 0
          persist-credentials: true

      - name: Patch Follow-ups and WhatsApp status truth
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          landing_path = Path("src/app/landing-v2/page.tsx")
          legacy_english_path = Path("src/lib/landingEnglishCopy.ts")
          active_copy_path = Path("src/lib/fanmindCopy.ts")
          test_path = Path("tests/public-product-copy.test.mjs")

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one occurrence, found {count}")
              return text.replace(old, new, 1)

          landing = landing_path.read_text(encoding="utf-8")
          landing = replace_once(
              landing,
              '''  {
              icon: "📣",
              title: "Manuelle Follow-ups",
              text: "Nächste Schritte bleiben sichtbar, priorisiert und bewusst manuell steuerbar.",
              tone: "orange",
              showComingSoonMark: true,
            },''',
              '''  {
              icon: "📣",
              title: "Manuelle Follow-ups",
              text: "Nächste Schritte bleiben sichtbar, priorisiert und bewusst manuell steuerbar.",
              tone: "orange",
            },''',
              "manual follow-ups card",
          )
          landing = replace_once(
              landing,
              '''  {
              icon: "▣",
              title: "4. Follow-ups",
              text: "Nächste Aktionen, Erinnerungen und Aufgaben im Blick.",
              body: "VIP-Upgrade Infos · Heute, 10:00 · Feedback abfragen",
              cta: "Alle Follow-ups",
              href: "#follow-ups",
              tone: "cyan",
              showComingSoonMark: true,
            },''',
              '''  {
              icon: "▣",
              title: "4. Follow-ups",
              text: "Nächste Aktionen, Erinnerungen und Aufgaben im Blick.",
              body: "VIP-Upgrade Infos · Heute, 10:00 · Feedback abfragen",
              cta: "Alle Follow-ups",
              href: "#follow-ups",
              tone: "cyan",
            },''',
              "follow-ups function card",
          )
          landing = replace_once(
              landing,
              '''    cta: "Alle Follow-ups anzeigen",
              href: "#follow-ups",
              showComingSoonMark: true,
            },''',
              '''    cta: "Alle Follow-ups anzeigen",
              href: "#follow-ups",
            },''',
              "follow-up six-step card",
          )
          landing = replace_once(
              landing,
              '{ platform: "whatsapp", title: "WhatsApp", text: "Chat-Kontext für spätere Synchronisation vorbereitet.", status: "Beta / in Vorbereitung", tone: "green" },',
              '{ platform: "whatsapp", title: "WhatsApp", text: "Chat-Kontext für spätere Synchronisation vorbereitet.", status: "Coming Soon", tone: "green" },',
              "WhatsApp channel status",
          )
          landing = replace_once(
              landing,
              '''  {
              icon: "☑",
              title: "Follow-ups",
              status: "Coming Soon",
              text: "Nachfassaktionen vorbereiten.",
            },''',
              '''  {
              icon: "☑",
              title: "Follow-ups",
              status: "Aktiv",
              text: "Nachfassaktionen vorbereiten.",
            },''',
              "follow-ups action status",
          )
          landing = replace_once(
              landing,
              "Facebook, Instagram und WhatsApp werden nur als vorbereitete Beta-Workflows gezeigt; keine produktive Vollintegration.",
              "Facebook und Instagram werden nur als vorbereitete Beta-Workflows gezeigt; keine produktive Vollintegration.",
              "beta summary",
          )
          landing = replace_once(
              landing,
              "TikTok, X, Discord, Kampagnen, Analytics/Reichweite sowie Rollen/Rechte bleiben Roadmap.",
              "WhatsApp, TikTok, X, Discord, Kampagnen, Analytics/Reichweite sowie Rollen/Rechte bleiben Roadmap.",
              "coming-soon summary",
          )
          landing_path.write_text(landing, encoding="utf-8")

          german_beta_old = "Facebook, Instagram und WhatsApp werden nur als vorbereitete Beta-Workflows gezeigt; keine produktive Vollintegration."
          german_beta_new = "Facebook und Instagram werden nur als vorbereitete Beta-Workflows gezeigt; keine produktive Vollintegration."
          english_beta_old = "Facebook, Instagram and WhatsApp are shown only as prepared beta workflows; there is no full production integration."
          english_beta_new = "Facebook and Instagram are shown only as prepared beta workflows; there is no full production integration."
          german_roadmap_old = "TikTok, X, Discord, Kampagnen, Analytics/Reichweite sowie Rollen/Rechte bleiben Roadmap."
          german_roadmap_new = "WhatsApp, TikTok, X, Discord, Kampagnen, Analytics/Reichweite sowie Rollen/Rechte bleiben Roadmap."
          english_roadmap_old = "TikTok, X, Discord, campaigns, analytics and reach, and roles and permissions remain on the roadmap."
          english_roadmap_new = "WhatsApp, TikTok, X, Discord, campaigns, analytics and reach, and roles and permissions remain on the roadmap."

          legacy = legacy_english_path.read_text(encoding="utf-8")
          legacy = replace_once(legacy, german_beta_old, german_beta_new, "legacy German beta key")
          legacy = replace_once(legacy, english_beta_old, english_beta_new, "legacy English beta value")
          legacy = replace_once(legacy, german_roadmap_old, german_roadmap_new, "legacy German roadmap key")
          legacy = replace_once(legacy, english_roadmap_old, english_roadmap_new, "legacy English roadmap value")
          legacy_english_path.write_text(legacy, encoding="utf-8")

          active = active_copy_path.read_text(encoding="utf-8")
          if german_beta_new in active or german_roadmap_new in active:
              raise SystemExit("active landing translations already contain the new status copy")
          anchor = '  "Nach oben": "Back to top",\n\n'
          insertion = (
              '  "Nach oben": "Back to top",\n'
              f'  "{german_beta_new}": "{english_beta_new}",\n'
              f'  "{german_roadmap_new}": "{english_roadmap_new}",\n\n'
          )
          active = replace_once(active, anchor, insertion, "active landing translation anchor")
          active_copy_path.write_text(active, encoding="utf-8")

          tests = test_path.read_text(encoding="utf-8")
          marker = 'test("public landing keeps follow-ups active and WhatsApp coming soon"'
          if marker in tests:
              raise SystemExit("product-truth regression test already exists")
          tests += r'''

          test("public landing keeps follow-ups active and WhatsApp coming soon", async () => {
            const landing = await readFile("src/app/landing-v2/page.tsx", "utf8");
            const translations = [
              await readFile("src/lib/landingEnglishCopy.ts", "utf8"),
              await readFile("src/lib/fanmindCopy.ts", "utf8"),
            ].join("\n");

            assert.doesNotMatch(
              landing,
              /title: "Manuelle Follow-ups"[\s\S]{0,240}showComingSoonMark: true/u,
              "aktive manuelle Follow-ups dürfen keine Coming-Soon-Markierung tragen",
            );
            assert.doesNotMatch(
              landing,
              /title: "4\. Follow-ups"[\s\S]{0,360}showComingSoonMark: true/u,
              "aktive Follow-up-Funktionskarte darf keine Coming-Soon-Markierung tragen",
            );
            assert.doesNotMatch(
              landing,
              /title: "Follow-up planen"[\s\S]{0,520}showComingSoonMark: true/u,
              "aktiver Follow-up-Schritt darf keine Coming-Soon-Markierung tragen",
            );
            assert.match(
              landing,
              /title: "Follow-ups",\s*status: "Aktiv",\s*text: "Nachfassaktionen vorbereiten\."/u,
            );
            assert.match(
              landing,
              /platform: "whatsapp", title: "WhatsApp",[^\n]*status: "Coming Soon"/u,
            );
            assert.doesNotMatch(
              landing,
              /Facebook, Instagram und WhatsApp werden nur als vorbereitete Beta-Workflows/u,
            );
            assert.match(
              landing,
              /Facebook und Instagram werden nur als vorbereitete Beta-Workflows gezeigt/u,
            );
            assert.match(
              landing,
              /WhatsApp, TikTok, X, Discord, Kampagnen, Analytics\/Reichweite sowie Rollen\/Rechte bleiben Roadmap/u,
            );
            assert.doesNotMatch(
              translations,
              /Facebook, Instagram und WhatsApp werden nur als vorbereitete Beta-Workflows/u,
            );
            assert.match(
              translations,
              /Facebook and Instagram are shown only as prepared beta workflows/u,
            );
            assert.match(
              translations,
              /WhatsApp, TikTok, X, Discord, campaigns, analytics and reach, and roles and permissions remain on the roadmap/u,
            );
          });
          '''
          test_path.write_text(tests, encoding="utf-8")
          PY

      - name: Run focused regression test
        run: node --test tests/public-product-copy.test.mjs

      - name: Validate, remove temporary workflows, commit and push
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          rm -f \
            .github/workflows/temp-product-truth-followups-whatsapp.yml \
            .github/workflows/temp-product-truth-followups-whatsapp-v2.yml
          git config user.name "Bernds-tech"
          git config user.email "270165082+Bernds-tech@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No product-truth changes were produced." >&2
            exit 1
          fi
          git commit -m "Align follow-ups and WhatsApp product truth"
          git push origin HEAD:p1/product-truth-followups-whatsapp-20260725
