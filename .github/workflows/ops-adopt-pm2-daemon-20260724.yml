name: FanMind P1 Adopt PM2 Daemon Into systemd

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
    paths:
      - ".github/workflows/ops-adopt-pm2-daemon-20260724.yml"

concurrency:
  group: fanmind-p1-adopt-pm2-daemon-20260724
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  adopt:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'ops/controlled-ubuntu-reboot-20260724'
    runs-on:
      - self-hosted
      - fanmind-prod
      - exoscale
      - linux
      - x64
    timeout-minutes: 15
    env:
      EXPECTED_RELEASE: 6b8ba61a1786651713b2507340dc7b673811159d
      REPORT_PATH: fanmind-pm2-systemd-adoption.txt

    steps:
      - name: Checkout trusted reboot branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ops/controlled-ubuntu-reboot-20260724
          fetch-depth: 1
          show-progress: false

      - name: Validate release, PM2 daemon and unit contract
        shell: bash
        run: |
          set -euo pipefail
          report="$GITHUB_WORKSPACE/$REPORT_PATH"
          state="$RUNNER_TEMP/fanmind-pm2-adoption-before.json"
          snapshot="$RUNNER_TEMP/fanmind-pm2-adoption-jlist.json"
          : > "$report"
          printf 'PM2_SYSTEMD_ADOPTION_UTC=%s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" | tee -a "$report"
          printf 'EXPECTED_RELEASE=%s\n' "$EXPECTED_RELEASE" | tee -a "$report"

          test "$(curl -fsSL --max-time 15 https://fanmind.ch/api/version | node -e 'let s="";process.stdin.on("data",c=>s+=c);process.stdin.on("end",()=>process.stdout.write(JSON.parse(s).releaseCommit||"missing"));')" = "$EXPECTED_RELEASE"
          test "$(git -C /var/www/fanmind rev-parse HEAD)" = "$EXPECTED_RELEASE"
          test "$(git -C /var/www/fanmind rev-parse origin/main)" = "$EXPECTED_RELEASE"
          test "$(systemctl is-enabled pm2-ubuntu.service)" = enabled
          test "$(systemctl show pm2-ubuntu.service -p Type --value)" = forking
          test "$(systemctl show pm2-ubuntu.service -p User --value)" = ubuntu
          pid_file="$(systemctl show pm2-ubuntu.service -p PIDFile --value)"
          test "$pid_file" = /home/ubuntu/.pm2/pm2.pid
          exec_start="$(systemctl show pm2-ubuntu.service -p ExecStart --value)"
          [[ "$exec_start" == *resurrect* ]]

          daemon_pid="$(ps -eo pid=,user=,args= | node -e '
            let s="";
            process.stdin.on("data", c => s += c);
            process.stdin.on("end", () => {
              const rows = s.split(/\r?\n/).map(line => line.trim()).filter(Boolean).map(line => {
                const match = line.match(/^(\d+)\s+(\S+)\s+(.+)$/);
                return match ? { pid: Number(match[1]), user: match[2], args: match[3] } : null;
              }).filter(Boolean).filter(row => row.user === "ubuntu" && /PM2 v.*God Daemon/.test(row.args) && row.args.includes("/home/ubuntu/.pm2"));
              if (rows.length !== 1) process.exit(1);
              process.stdout.write(String(rows[0].pid));
            });
          ')"
          test "$daemon_pid" -gt 1
          test "$(stat -c %U /proc/$daemon_pid)" = ubuntu

          umask 077
          pm2 jlist > "$snapshot"
          SNAPSHOT="$snapshot" STATE="$state" EXPECTED_RELEASE="$EXPECTED_RELEASE" DAEMON_PID="$daemon_pid" node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const rows = JSON.parse(fs.readFileSync(process.env.SNAPSHOT, 'utf8')).filter(item => item?.name === 'fanmind');
          if (rows.length !== 1) process.exit(1);
          const row = rows[0];
          const value = {
            appPid: Number(row.pid || 0),
            restarts: Number(row?.pm2_env?.restart_time),
            status: String(row?.pm2_env?.status || ''),
            cwdMatches: String(row?.pm2_env?.pm_cwd || '') === `/var/www/fanmind-releases/${process.env.EXPECTED_RELEASE}`,
            daemonPid: Number(process.env.DAEMON_PID),
          };
          if (value.appPid < 1 || !Number.isInteger(value.restarts) || value.restarts < 0 || value.status !== 'online' || !value.cwdMatches || value.daemonPid < 2) process.exit(1);
          fs.writeFileSync(process.env.STATE, JSON.stringify(value), { mode: 0o600 });
          NODE
          rm -f "$snapshot"

          echo 'PM2_DAEMON_COUNT=1' | tee -a "$report"
          echo 'PM2_DAEMON_USER=ubuntu' | tee -a "$report"
          echo 'PM2_UNIT_CONTRACT=valid' | tee -a "$report"
          echo 'PM2_APP_PRE_ADOPTION=healthy' | tee -a "$report"

      - name: Restore the missing PM2 PID file and adopt the daemon
        shell: bash
        run: |
          set -euo pipefail
          report="$GITHUB_WORKSPACE/$REPORT_PATH"
          state="$RUNNER_TEMP/fanmind-pm2-adoption-before.json"
          daemon_pid="$(node -e 'const fs=require("fs");process.stdout.write(String(JSON.parse(fs.readFileSync(process.argv[1],"utf8")).daemonPid));' "$state")"
          pid_file="$(systemctl show pm2-ubuntu.service -p PIDFile --value)"
          test "$pid_file" = /home/ubuntu/.pm2/pm2.pid

          if [ -s "$pid_file" ]; then
            existing="$(tr -d '[:space:]' < "$pid_file")"
            test "$existing" = "$daemon_pid"
            echo 'PM2_PIDFILE_ACTION=preserved' | tee -a "$report"
          else
            temp="$RUNNER_TEMP/pm2.pid"
            printf '%s\n' "$daemon_pid" > "$temp"
            chmod 0644 "$temp"
            install -o ubuntu -g ubuntu -m 0644 "$temp" "$pid_file"
            rm -f "$temp"
            echo 'PM2_PIDFILE_ACTION=restored' | tee -a "$report"
          fi

          sudo -n systemctl reset-failed pm2-ubuntu.service
          sudo -n systemctl start pm2-ubuntu.service
          for attempt in $(seq 1 30); do
            if systemctl is-active --quiet pm2-ubuntu.service; then
              break
            fi
            sleep 1
          done
          systemctl is-active --quiet pm2-ubuntu.service
          main_pid="$(systemctl show pm2-ubuntu.service -p MainPID --value)"
          test "$main_pid" = "$daemon_pid"
          echo 'PM2_SYSTEMD_SERVICE=active' | tee -a "$report"
          echo 'PM2_SYSTEMD_MAIN_PID_MATCH=yes' | tee -a "$report"

      - name: Prove service adoption caused no app restart and remains stable
        shell: bash
        run: |
          set -euo pipefail
          report="$GITHUB_WORKSPACE/$REPORT_PATH"
          state="$RUNNER_TEMP/fanmind-pm2-adoption-before.json"

          verify_app() {
            local snapshot="$1"
            pm2 jlist > "$snapshot"
            BEFORE="$state" SNAPSHOT="$snapshot" EXPECTED_RELEASE="$EXPECTED_RELEASE" node --input-type=module <<'NODE'
            import fs from 'node:fs';
            const before = JSON.parse(fs.readFileSync(process.env.BEFORE, 'utf8'));
            const rows = JSON.parse(fs.readFileSync(process.env.SNAPSHOT, 'utf8')).filter(item => item?.name === 'fanmind');
            if (rows.length !== 1) process.exit(1);
            const row = rows[0];
            const current = {
              appPid: Number(row.pid || 0),
              restarts: Number(row?.pm2_env?.restart_time),
              status: String(row?.pm2_env?.status || ''),
              cwdMatches: String(row?.pm2_env?.pm_cwd || '') === `/var/www/fanmind-releases/${process.env.EXPECTED_RELEASE}`,
            };
            if (current.status !== 'online' || !current.cwdMatches || current.appPid !== before.appPid || current.restarts !== before.restarts) process.exit(1);
            NODE
            rm -f "$snapshot"
          }

          umask 077
          verify_app "$RUNNER_TEMP/fanmind-pm2-after-adoption-1.json"
          sleep 30
          systemctl is-active --quiet pm2-ubuntu.service
          verify_app "$RUNNER_TEMP/fanmind-pm2-after-adoption-2.json"

          curl -fsSL --max-time 15 https://fanmind.ch/api/health | node -e '
            let s="";
            process.stdin.on("data", c => s += c);
            process.stdin.on("end", () => {
              const payload = JSON.parse(s);
              const checks = Array.isArray(payload.checks) ? payload.checks : [];
              process.exit(payload.status === "healthy" && checks.length >= 7 && checks.every(item => item?.status === "healthy") ? 0 : 1);
            });
          '
          echo 'PM2_APP_PID_UNCHANGED=yes' | tee -a "$report"
          echo 'PM2_APP_RESTART_COUNT_UNCHANGED=yes' | tee -a "$report"
          echo 'PM2_SYSTEMD_STABLE_30_SECONDS=yes' | tee -a "$report"
          echo 'PUBLIC_HEALTH_AFTER_ADOPTION=healthy' | tee -a "$report"
          echo 'PM2_SYSTEMD_ADOPTION_RESULT=success' | tee -a "$report"

      - name: Upload sanitized PM2 adoption evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fanmind-pm2-systemd-adoption
          path: fanmind-pm2-systemd-adoption.txt
          if-no-files-found: error
          retention-days: 14
