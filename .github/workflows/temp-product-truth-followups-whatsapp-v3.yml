name: Temporary Follow-ups and WhatsApp Product Truth v3

on:
  push:
    branches:
      - p1/product-truth-followups-whatsapp-20260725
    paths:
      - .github/workflows/temp-product-truth-followups-whatsapp-v3.yml

permissions:
  contents: write

jobs:
  patch-product-truth:
    name: Patch and push product files only
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout target branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: p1/product-truth-followups-whatsapp-20260725
          fetch-depth: 0
          persist-credentials: true

      - name: Apply and test product-truth patch
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/temp-product-truth-followups-whatsapp.py
          node --test tests/public-product-copy.test.mjs
          git diff --check

      - name: Commit product files without modifying workflows
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Bernds-tech"
          git config user.email "270165082+Bernds-tech@users.noreply.github.com"
          git add \
            src/app/landing-v2/page.tsx \
            src/lib/landingEnglishCopy.ts \
            src/lib/fanmindCopy.ts \
            tests/public-product-copy.test.mjs
          if git diff --cached --quiet; then
            echo "No product-truth changes were produced." >&2
            exit 1
          fi
          git commit -m "Align follow-ups and WhatsApp product truth"
          git push origin HEAD:p1/product-truth-followups-whatsapp-20260725
