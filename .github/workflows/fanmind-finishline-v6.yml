name: FanMind Finishline V6

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '27 5 * * *'

permissions:
  contents: read

jobs:
  finishline-v6:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate finishline state
        run: python3 scripts/fanmind_sales_readiness.py
      - name: Scan canonical truth drift
        run: python3 scripts/fanmind_truth_drift_check.py
