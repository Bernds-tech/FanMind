name: FanMind P1 Sidebar Responsive Patch

on:
  push:
    branches:
      - p1/sidebar-consistency-social-avatar-20260725
    paths:
      - ".github/workflows/p1-sidebar-responsive-patch-temp.yml"
      - "scripts/ui/sidebar-responsive-patch-temp.py"

concurrency:
  group: fanmind-p1-sidebar-responsive-patch
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout trusted sidebar branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: p1/sidebar-consistency-social-avatar-20260725
          fetch-depth: 1
          show-progress: false

      - name: Apply deterministic responsive sidebar patch
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ui/sidebar-responsive-patch-temp.py
          git diff --check

      - name: Commit responsive layout correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/WorkspaceSidebar.module.css src/app/dashboard/dashboard.module.css
          git diff --cached --quiet && { echo "Responsive sidebar patch produced no changes" >&2; exit 1; }
          git commit -m "Fix narrow viewport sidebar overlay geometry"
          git push origin HEAD:p1/sidebar-consistency-social-avatar-20260725
