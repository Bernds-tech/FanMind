name: FanMind P1 Self-hosted Runner Status

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
    paths:
      - ".github/workflows/ops-self-hosted-runner-status-20260724.yml"

concurrency:
  group: fanmind-p1-self-hosted-runner-status-20260724
  cancel-in-progress: true

permissions:
  actions: read
  contents: read

jobs:
  status:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'ops/controlled-ubuntu-reboot-20260724'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      REPORT_PATH: fanmind-self-hosted-runner-status.txt
      EXPECTED_RUNNER_NAME: fanmind-prod-01-exoscale

    steps:
      - name: Query only the expected Production runner status
        shell: bash
        run: |
          set -euo pipefail
          gh api --paginate \
            -H 'Accept: application/vnd.github+json' \
            "/repos/$GITHUB_REPOSITORY/actions/runners?per_page=100" \
            > "$RUNNER_TEMP/fanmind-runners.json"
          node <<'NODE' > "$REPORT_PATH"
          const fs = require('node:fs');
          const payload = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/fanmind-runners.json', 'utf8'));
          const rows = Array.isArray(payload.runners) ? payload.runners : [];
          const matches = rows.filter(row => row?.name === process.env.EXPECTED_RUNNER_NAME);
          if (matches.length !== 1) throw new Error('expected_runner_count_invalid');
          const row = matches[0];
          const labels = new Set((row.labels || []).map(label => String(label?.name || '')));
          for (const required of ['self-hosted', 'fanmind-prod', 'exoscale', 'linux', 'x64']) {
            if (!labels.has(required)) throw new Error('expected_runner_label_missing');
          }
          console.log(`RUNNER_STATUS_UTC=${new Date().toISOString()}`);
          console.log('EXPECTED_RUNNER_COUNT=1');
          console.log(`EXPECTED_RUNNER_STATUS=${String(row.status || 'unknown')}`);
          console.log(`EXPECTED_RUNNER_BUSY=${row.busy === true ? 'yes' : 'no'}`);
          console.log('EXPECTED_RUNNER_LABELS=valid');
          console.log('RUNNER_IDENTIFIERS_OR_TOKENS_PRINTED=false');
          NODE
          rm -f "$RUNNER_TEMP/fanmind-runners.json"
          cat "$REPORT_PATH"

      - name: Upload sanitized runner status
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fanmind-self-hosted-runner-status
          path: fanmind-self-hosted-runner-status.txt
          if-no-files-found: error
          retention-days: 3
