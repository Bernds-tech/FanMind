name: FanMind P1 Verify Meta Pixel Production

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
    paths:
      - ".github/workflows/ops-verify-meta-pixel-production-20260724.yml"
      - "scripts/operations/verify-meta-pixel-production-temp-20260724.mjs"
      - "scripts/operations/verify-meta-pixel-network-temp-20260724.mjs"

concurrency:
  group: fanmind-p1-verify-meta-pixel-production-20260724
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  release:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'ops/verify-meta-pixel-production-20260724'
    runs-on:
      - self-hosted
      - fanmind-prod
      - exoscale
      - linux
      - x64
    timeout-minutes: 25
    env:
      EXPECTED_RELEASE: 6b8ba61a1786651713b2507340dc7b673811159d
      REPORT_PATH: fanmind-meta-pixel-production-release.txt

    steps:
      - name: Checkout trusted verification branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ops/verify-meta-pixel-production-20260724
          fetch-depth: 1
          show-progress: false

      - name: Wait for exact deployed release and healthy Production
        shell: bash
        run: |
          set -euo pipefail
          report="$GITHUB_WORKSPACE/$REPORT_PATH"
          : > "$report"
          printf 'RELEASE_VERIFICATION_UTC=%s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" | tee -a "$report"
          printf 'EXPECTED_RELEASE=%s\n' "$EXPECTED_RELEASE" | tee -a "$report"

          for attempt in $(seq 1 120); do
            live_release="$(curl -fsSL --max-time 15 https://fanmind.ch/api/version 2>/dev/null | node -e '
              let input="";
              process.stdin.on("data", chunk => input += chunk);
              process.stdin.on("end", () => {
                try {
                  const payload = JSON.parse(input);
                  process.stdout.write(typeof payload.releaseCommit === "string" ? payload.releaseCommit : "missing");
                } catch {
                  process.stdout.write("missing");
                }
              });
            ' || true)"
            server_head="$(git -C /var/www/fanmind rev-parse HEAD 2>/dev/null || true)"
            origin_main="$(git -C /var/www/fanmind rev-parse origin/main 2>/dev/null || true)"

            if [[ "$live_release" == "$EXPECTED_RELEASE" \
              && "$server_head" == "$EXPECTED_RELEASE" \
              && "$origin_main" == "$EXPECTED_RELEASE" ]]; then
              if curl -fsSL --max-time 15 https://fanmind.ch/api/health | node -e '
                let input="";
                process.stdin.on("data", chunk => input += chunk);
                process.stdin.on("end", () => {
                  try {
                    const payload = JSON.parse(input);
                    const components = Object.values(payload.components || {});
                    process.exit(
                      payload.status === "healthy" &&
                      components.every(item => item?.status === "healthy")
                        ? 0
                        : 1,
                    );
                  } catch {
                    process.exit(1);
                  }
                });
              '; then
                echo 'PRODUCTION_RELEASE_SYNC=ok' | tee -a "$report"
                echo 'PRODUCTION_PUBLIC_HEALTH=healthy' | tee -a "$report"
                exit 0
              fi
            fi
            sleep 10
          done

          echo 'PRODUCTION_RELEASE_SYNC=failed' | tee -a "$report"
          exit 1

      - name: Verify exact Production ENV and deployed Meta source contract
        shell: bash
        run: |
          set -euo pipefail
          report="$GITHUB_WORKSPACE/$REPORT_PATH"

          sudo -n env REPORT_PATH="$report" /usr/bin/node --input-type=module <<'NODE'
          import { appendFile, readFile } from 'node:fs/promises';

          const envFile = '/var/www/fanmind/.env.production';
          const expected = '2069553844439892';
          const rows = (await readFile(envFile, 'utf8'))
            .split(/\r?\n/)
            .filter(line => /^\s*NEXT_PUBLIC_META_PIXEL_ID\s*=/.test(line));
          if (rows.length !== 1) throw new Error('meta_pixel_env_count_invalid');
          const value = rows[0]
            .slice(rows[0].indexOf('=') + 1)
            .trim()
            .replace(/^(["'])(.*)\1$/, '$2');
          if (value !== expected) throw new Error('meta_pixel_env_value_invalid');

          const output = [
            'PRODUCTION_META_PIXEL_ENV_KEY_COUNT=1',
            'PRODUCTION_META_PIXEL_ENV_EXACT_MATCH=yes',
            'OTHER_ENV_VALUES_WERE_NOT_PRINTED=true',
          ];
          await appendFile(process.env.REPORT_PATH, `${output.join('\n')}\n`, { mode: 0o644 });
          process.stdout.write(`${output.join('\n')}\n`);
          NODE

          test -f /var/www/fanmind/src/components/marketing/MarketingConsentManager.tsx
          test -f /var/www/fanmind/src/components/marketing/MetaPixelLoader.tsx
          test -f /var/www/fanmind/src/lib/metaPixel.ts
          test -f /var/www/fanmind/src/lib/metaPixelPolicy.mjs
          test -f /var/www/fanmind/docs/analytics/META_PIXEL.md
          test ! -e /var/www/fanmind/scripts/operations/verify-meta-pixel-production-temp-20260724.mjs
          test ! -e /var/www/fanmind/scripts/operations/verify-meta-pixel-network-temp-20260724.mjs
          git -C /var/www/fanmind grep -q "autoConfig',false" -- src/lib/metaPixelPolicy.mjs
          git -C /var/www/fanmind grep -q 'META_PIXEL_ACTIVE_EVENTS = Object.freeze(\["PageView"\])' -- src/lib/metaPixelPolicy.mjs
          git -C /var/www/fanmind grep -q 'NEXT_PUBLIC_META_PIXEL_ID' -- src/app/layout.tsx

          echo 'DEPLOYED_META_PIXEL_COMPONENTS=present' | tee -a "$report"
          echo 'DEPLOYED_META_PIXEL_AUTOCONFIG=disabled' | tee -a "$report"
          echo 'DEPLOYED_META_PIXEL_ACTIVE_EVENT=PageView' | tee -a "$report"
          echo 'TEMPORARY_VERIFIERS_DEPLOYED=absent' | tee -a "$report"

      - name: Verify public routes remain healthy
        shell: bash
        run: |
          set -euo pipefail
          report="$GITHUB_WORKSPACE/$REPORT_PATH"
          for path in / /login /register /forgot-password /datenschutz /roadmap /api/version /api/health; do
            curl -fsSL --max-time 20 "https://fanmind.ch${path}" -o /dev/null
          done
          echo 'PUBLIC_CORE_AND_PRIVACY_ROUTES=healthy' | tee -a "$report"
          echo 'META_PIXEL_PRODUCTION_RELEASE_RESULT=success' | tee -a "$report"

      - name: Upload sanitized release evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fanmind-meta-pixel-production-release
          path: fanmind-meta-pixel-production-release.txt
          if-no-files-found: error
          retention-days: 7

  browser:
    needs: release
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'ops/verify-meta-pixel-production-20260724'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      REPORT_PATH: fanmind-meta-pixel-production-browser.txt

    steps:
      - name: Checkout trusted verification branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ops/verify-meta-pixel-production-20260724
          fetch-depth: 1
          show-progress: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies reproducibly
        run: npm ci --no-audit --no-fund

      - name: Install Chromium only
        run: npx playwright install chromium

      - name: Verify Production consent, PageView calls and route boundaries
        run: |
          set -euo pipefail
          node scripts/operations/verify-meta-pixel-production-temp-20260724.mjs "$REPORT_PATH"

      - name: Upload sanitized browser evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fanmind-meta-pixel-production-browser
          path: fanmind-meta-pixel-production-browser.txt
          if-no-files-found: error
          retention-days: 7

  network:
    needs: release
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'ops/verify-meta-pixel-production-20260724'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      REPORT_PATH: fanmind-meta-pixel-network-verification.txt

    steps:
      - name: Checkout trusted verification branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ops/verify-meta-pixel-production-20260724
          fetch-depth: 1
          show-progress: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies reproducibly
        run: npm ci --no-audit --no-fund

      - name: Install Chromium only
        run: npx playwright install chromium

      - name: Verify uninstrumented real Meta PageView transport
        run: |
          set -euo pipefail
          node scripts/operations/verify-meta-pixel-network-temp-20260724.mjs "$REPORT_PATH"

      - name: Upload sanitized network evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fanmind-meta-pixel-network-verification
          path: fanmind-meta-pixel-network-verification.txt
          if-no-files-found: error
          retention-days: 7
