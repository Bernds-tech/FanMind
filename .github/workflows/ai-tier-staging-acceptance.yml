name: FanMind AI Tier Staging Acceptance

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type run-ai-tier-staging-acceptance to confirm the isolated write test'
        required: true
        type: string

concurrency:
  group: fanmind-ai-tier-staging-acceptance
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ai-tier-staging-acceptance:
    name: Verify isolated AI tier storage and Stripe test catalog
    if: ${{ inputs.confirmation == 'run-ai-tier-staging-acceptance' }}
    runs-on: ubuntu-24.04
    environment: staging
    env:
      FANMIND_RUNTIME_ENVIRONMENT: staging
      NEXT_PUBLIC_APP_URL: ${{ vars.FANMIND_STAGING_APP_URL }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.FANMIND_STAGING_SUPABASE_URL }}
      FANMIND_TARGET_SUPABASE_PROJECT_REF: ${{ vars.FANMIND_STAGING_SUPABASE_PROJECT_REF }}
      FANMIND_PRODUCTION_SUPABASE_PROJECT_REF: ${{ vars.FANMIND_PRODUCTION_SUPABASE_PROJECT_REF }}
      FANMIND_ENABLE_NON_PRODUCTION_WRITES: 'true'
      FANMIND_NON_PRODUCTION_WRITE_ACK: I_UNDERSTAND_NON_PRODUCTION_ONLY
      FANMIND_AI_TIER_STAGING_ACCEPTANCE_CONFIRM: run-ai-tier-staging-acceptance
      FANMIND_AI_TIER_STAGING_WORKSPACE_ID: ${{ vars.FANMIND_AI_TIER_STAGING_WORKSPACE_ID }}
      STRIPE_SECRET_KEY: ${{ secrets.FANMIND_STAGING_STRIPE_SECRET_KEY }}
      STRIPE_PRICE_AI_PLUS: ${{ vars.FANMIND_STAGING_STRIPE_PRICE_AI_PLUS }}
      STRIPE_PRICE_AI_ULTRA: ${{ vars.FANMIND_STAGING_STRIPE_PRICE_AI_ULTRA }}
      PGHOST: ${{ secrets.FANMIND_STAGING_DB_HOST }}
      FANMIND_TARGET_DB_HOST: ${{ secrets.FANMIND_STAGING_DB_HOST }}
      PGPORT: ${{ vars.FANMIND_STAGING_DB_PORT }}
      PGDATABASE: ${{ vars.FANMIND_STAGING_DB_NAME }}
      PGUSER: ${{ secrets.FANMIND_STAGING_DB_USER }}

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Prepare private database password file
        env:
          FANMIND_STAGING_DB_PASSWORD: ${{ secrets.FANMIND_STAGING_DB_PASSWORD }}
          PGPASSFILE: ${{ runner.temp }}/fanmind-ai-tier-staging.pgpass
        run: |
          set -euo pipefail
          umask 077
          case "$FANMIND_STAGING_DB_PASSWORD" in
            *$'\n'*|*$'\r'*)
              echo "Staging database password contains an unsupported line break." >&2
              exit 1
              ;;
          esac
          ESCAPED_DB_PASSWORD="${FANMIND_STAGING_DB_PASSWORD//\\/\\\\}"
          ESCAPED_DB_PASSWORD="${ESCAPED_DB_PASSWORD//:/\\:}"
          printf '%s:%s:%s:%s:%s\n' \
            "$PGHOST" \
            "$PGPORT" \
            "$PGDATABASE" \
            "$PGUSER" \
            "$ESCAPED_DB_PASSWORD" > "$PGPASSFILE"
          chmod 600 "$PGPASSFILE"

      - name: Verify applied migration metadata
        env:
          PGPASSFILE: ${{ runner.temp }}/fanmind-ai-tier-staging.pgpass
        run: npm run db:ai-tier-entitlements:verify

      - name: Run transactional staging acceptance
        env:
          PGPASSFILE: ${{ runner.temp }}/fanmind-ai-tier-staging.pgpass
        run: npm run ai:tiers:staging:run

      - name: Remove private database password file
        if: ${{ always() }}
        env:
          PGPASSFILE: ${{ runner.temp }}/fanmind-ai-tier-staging.pgpass
        run: rm -f "$PGPASSFILE"
