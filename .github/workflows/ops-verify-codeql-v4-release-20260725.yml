name: FanMind P1 Verify CodeQL v4 Release

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
    paths:
      - ".github/workflows/ops-verify-codeql-v4-release-20260725.yml"

concurrency:
  group: fanmind-p1-verify-codeql-v4-release-20260725
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'ops/verify-codeql-v4-release-20260725'
    runs-on:
      - self-hosted
      - fanmind-prod
      - exoscale
      - linux
      - x64
    timeout-minutes: 30
    env:
      EXPECTED_RELEASE: 74cb221c9d03e4757c3b364864ed328f729bff90
      EXPECTED_CODEQL_SHA: e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81
      REPORT_PATH: fanmind-codeql-v4-production-verification.txt
    steps:
      - name: Checkout trusted verification branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ops/verify-codeql-v4-release-20260725
          fetch-depth: 1
          show-progress: false

      - name: Wait for exact release and verify deployed CodeQL contract
        shell: bash
        run: |
          set -euo pipefail
          report="$GITHUB_WORKSPACE/$REPORT_PATH"
          : > "$report"
          printf 'VERIFICATION_UTC=%s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" | tee -a "$report"
          printf 'EXPECTED_RELEASE=%s\n' "$EXPECTED_RELEASE" | tee -a "$report"

          git -C /var/www/fanmind fetch --prune origin main >/dev/null 2>&1
          synchronized=no
          for attempt in $(seq 1 180); do
            live_release="$(curl -fsSL --max-time 12 https://fanmind.ch/api/version 2>/dev/null | node -e '
              let input="";
              process.stdin.on("data", chunk => input += chunk);
              process.stdin.on("end", () => {
                try { process.stdout.write(JSON.parse(input).releaseCommit || "missing"); }
                catch { process.stdout.write("invalid"); }
              });
            ' 2>/dev/null || printf unavailable)"
            server_head="$(git -C /var/www/fanmind rev-parse HEAD 2>/dev/null || true)"
            origin_main="$(git -C /var/www/fanmind rev-parse origin/main 2>/dev/null || true)"
            current_release="$(readlink -f /var/www/fanmind-current 2>/dev/null || true)"
            if [ "$live_release" = "$EXPECTED_RELEASE" ] && \
               [ "$server_head" = "$EXPECTED_RELEASE" ] && \
               [ "$origin_main" = "$EXPECTED_RELEASE" ] && \
               [ "$current_release" = "/var/www/fanmind-releases/$EXPECTED_RELEASE" ]; then
              synchronized=yes
              break
            fi
            if [ $((attempt % 18)) -eq 0 ]; then
              git -C /var/www/fanmind fetch --prune origin main >/dev/null 2>&1 || true
            fi
            sleep 5
          done
          test "$synchronized" = yes

          curl -fsSL --max-time 15 https://fanmind.ch/api/health | node -e '
            let input="";
            process.stdin.on("data", chunk => input += chunk);
            process.stdin.on("end", () => {
              const payload = JSON.parse(input);
              const checks = Array.isArray(payload.checks) ? payload.checks : [];
              process.exit(payload.status === "healthy" && checks.length >= 7 && checks.every(item => item?.status === "healthy") ? 0 : 1);
            });
          '

          CODEQL_FILE="/var/www/fanmind/.github/workflows/codeql.yml" \
          DOC_FILE="/var/www/fanmind/docs/security/SUPPLY_CHAIN.md" \
          TEST_FILE="/var/www/fanmind/tests/github-actions-supply-chain.test.mjs" \
          EXPECTED_CODEQL_SHA="$EXPECTED_CODEQL_SHA" node <<'NODE' | tee -a "$report"
          const fs = require('node:fs');
          const workflow = fs.readFileSync(process.env.CODEQL_FILE, 'utf8');
          const docs = fs.readFileSync(process.env.DOC_FILE, 'utf8');
          const tests = fs.readFileSync(process.env.TEST_FILE, 'utf8');
          const sha = process.env.EXPECTED_CODEQL_SHA;
          const initCount = (workflow.match(new RegExp(`github/codeql-action/init@${sha}`, 'g')) || []).length;
          const analyzeCount = (workflow.match(new RegExp(`github/codeql-action/analyze@${sha}`, 'g')) || []).length;
          if (initCount !== 1 || analyzeCount !== 1) throw new Error('deployed_codeql_pins_invalid');
          if (!workflow.includes('queries: security-extended')) throw new Error('deployed_codeql_queries_invalid');
          if (!docs.includes('CodeQL-v4-Action `4.37.3`')) throw new Error('deployed_codeql_docs_invalid');
          if (!tests.includes('CODEQL_V4_37_3_SHA')) throw new Error('deployed_codeql_test_invalid');
          console.log('DEPLOYED_CODEQL_INIT_V4_37_3=yes');
          console.log('DEPLOYED_CODEQL_ANALYZE_V4_37_3=yes');
          console.log('DEPLOYED_CODEQL_SECURITY_EXTENDED=yes');
          console.log('DEPLOYED_CODEQL_RUNBOOK_AND_REGRESSION=yes');
          NODE

          for route in / /login /register /forgot-password /account-deletion /datenschutz /roadmap /api/version /api/health; do
            curl -fsSL --max-time 15 "https://fanmind.ch${route}" -o /dev/null
          done
          systemctl is-active --quiet nginx.service
          systemctl is-active --quiet pm2-ubuntu.service
          systemctl is-active --quiet fanmind-backup-worker.service

          printf '%s\n' \
            'RELEASE_SYNC=exact' \
            'PUBLIC_REQUIRED_HEALTHY_COUNT=7' \
            'PUBLIC_CORE_ROUTES=healthy' \
            'NGINX_PM2_BACKUP_WORKER=active' \
            'CUSTOMER_BILLING_CRM_OR_DATABASE_MUTATION=none' \
            'CODEQL_V4_PRODUCTION_VERIFICATION=success' \
            | tee -a "$report"

      - name: Upload sanitized verification evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fanmind-codeql-v4-production-verification
          path: fanmind-codeql-v4-production-verification.txt
          if-no-files-found: error
          retention-days: 7
