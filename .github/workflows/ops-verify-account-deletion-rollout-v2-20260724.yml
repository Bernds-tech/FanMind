name: FanMind P1 Verify Account Deletion Rollout V2

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
    paths:
      - ".github/workflows/ops-verify-account-deletion-rollout-v2-20260724.yml"
      - "scripts/operations/verify-account-deletion-rollout-v2-temp-20260724.mjs"

concurrency:
  group: fanmind-p1-verify-account-deletion-rollout-v2-20260724
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'ops/activate-account-deletion-20260724'
    runs-on:
      - self-hosted
      - fanmind-prod
      - exoscale
      - linux
      - x64
    timeout-minutes: 25
    env:
      EXPECTED_RELEASE: 6b8ba61a1786651713b2507340dc7b673811159d
      REPORT_PATH: fanmind-account-deletion-rollout-v2.txt

    steps:
      - name: Checkout trusted rollout branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ops/activate-account-deletion-20260724
          fetch-depth: 1
          show-progress: false

      - name: Verify schema, synthetic lifecycle and processor dry-run
        shell: bash
        run: |
          set -euo pipefail
          report="$GITHUB_WORKSPACE/$REPORT_PATH"
          sudo -n env \
            EXPECTED_RELEASE="$EXPECTED_RELEASE" \
            GITHUB_RUN_ID="$GITHUB_RUN_ID" \
            /usr/bin/node \
            "$GITHUB_WORKSPACE/scripts/operations/verify-account-deletion-rollout-v2-temp-20260724.mjs" \
            "$report"
          sudo -n chown "$(id -u):$(id -g)" "$report"
          chmod 0600 "$report"
          test -r "$report"

      - name: Upload sanitized rollout evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fanmind-account-deletion-rollout-v2
          path: fanmind-account-deletion-rollout-v2.txt
          if-no-files-found: error
          retention-days: 14
