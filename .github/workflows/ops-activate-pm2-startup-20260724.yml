name: FanMind P1 Activate PM2 Startup Before Reboot

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
    paths:
      - ".github/workflows/ops-activate-pm2-startup-20260724.yml"

concurrency:
  group: fanmind-p1-activate-pm2-startup-20260724
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  activate:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'ops/controlled-ubuntu-reboot-20260724'
    runs-on:
      - self-hosted
      - fanmind-prod
      - exoscale
      - linux
      - x64
    timeout-minutes: 15
    env:
      EXPECTED_RELEASE: 6b8ba61a1786651713b2507340dc7b673811159d
      REPORT_PATH: fanmind-pm2-startup-activation.txt

    steps:
      - name: Checkout trusted reboot branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ops/controlled-ubuntu-reboot-20260724
          fetch-depth: 1
          show-progress: false

      - name: Verify exact release and capture PM2 app state
        shell: bash
        run: |
          set -euo pipefail
          report="$GITHUB_WORKSPACE/$REPORT_PATH"
          state="$RUNNER_TEMP/fanmind-pm2-state-before.json"
          pm2_snapshot="$RUNNER_TEMP/fanmind-pm2-jlist-before.json"
          : > "$report"
          printf 'PM2_ACTIVATION_UTC=%s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" | tee -a "$report"
          printf 'EXPECTED_RELEASE=%s\n' "$EXPECTED_RELEASE" | tee -a "$report"

          live_release="$(curl -fsSL --max-time 15 https://fanmind.ch/api/version | node -e '
            let input="";
            process.stdin.on("data", chunk => input += chunk);
            process.stdin.on("end", () => process.stdout.write(JSON.parse(input).releaseCommit || "missing"));
          ')"
          test "$live_release" = "$EXPECTED_RELEASE"
          test "$(git -C /var/www/fanmind rev-parse HEAD)" = "$EXPECTED_RELEASE"
          test "$(git -C /var/www/fanmind rev-parse origin/main)" = "$EXPECTED_RELEASE"
          test "$(systemctl is-enabled pm2-ubuntu.service)" = enabled

          umask 077
          pm2 jlist > "$pm2_snapshot"
          EXPECTED_RELEASE="$EXPECTED_RELEASE" STATE_PATH="$state" PM2_SNAPSHOT="$pm2_snapshot" node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const rows = JSON.parse(fs.readFileSync(process.env.PM2_SNAPSHOT, 'utf8'))
            .filter(item => item?.name === 'fanmind');
          if (rows.length !== 1) process.exit(1);
          const row = rows[0];
          const value = {
            pid: Number(row.pid || 0),
            restarts: Number(row?.pm2_env?.restart_time),
            status: String(row?.pm2_env?.status || ''),
            cwdMatches: String(row?.pm2_env?.pm_cwd || '') === `/var/www/fanmind-releases/${process.env.EXPECTED_RELEASE}`,
          };
          if (value.pid < 1 || !Number.isInteger(value.restarts) || value.restarts < 0 || value.status !== 'online' || !value.cwdMatches) {
            process.exit(1);
          }
          fs.writeFileSync(process.env.STATE_PATH, JSON.stringify(value), { mode: 0o600 });
          NODE
          rm -f "$pm2_snapshot"
          echo 'PM2_PRE_ACTIVATION_APP=healthy' | tee -a "$report"

      - name: Start enabled PM2 startup service without restarting the app
        shell: bash
        run: |
          set -euo pipefail
          report="$GITHUB_WORKSPACE/$REPORT_PATH"
          sudo -n systemctl start pm2-ubuntu.service
          for attempt in $(seq 1 30); do
            if systemctl is-active --quiet pm2-ubuntu.service; then
              break
            fi
            sleep 1
          done
          systemctl is-active --quiet pm2-ubuntu.service
          main_pid="$(systemctl show pm2-ubuntu.service -p MainPID --value)"
          test "${main_pid:-0}" -gt 0
          echo 'PM2_STARTUP_SERVICE=active' | tee -a "$report"
          echo 'PM2_STARTUP_MAIN_PID_PRESENT=yes' | tee -a "$report"

      - name: Confirm FanMind app state was not changed by service adoption
        shell: bash
        run: |
          set -euo pipefail
          report="$GITHUB_WORKSPACE/$REPORT_PATH"
          state="$RUNNER_TEMP/fanmind-pm2-state-before.json"
          after_snapshot="$RUNNER_TEMP/fanmind-pm2-jlist-after.json"
          umask 077
          pm2 jlist > "$after_snapshot"
          BEFORE_PATH="$state" AFTER_PATH="$after_snapshot" EXPECTED_RELEASE="$EXPECTED_RELEASE" node --input-type=module <<'NODE' | tee -a "$report"
          import fs from 'node:fs';
          const before = JSON.parse(fs.readFileSync(process.env.BEFORE_PATH, 'utf8'));
          const rows = JSON.parse(fs.readFileSync(process.env.AFTER_PATH, 'utf8'))
            .filter(item => item?.name === 'fanmind');
          if (rows.length !== 1) throw new Error('pm2_fanmind_count_invalid');
          const row = rows[0];
          const after = {
            pid: Number(row.pid || 0),
            restarts: Number(row?.pm2_env?.restart_time),
            status: String(row?.pm2_env?.status || ''),
            cwdMatches: String(row?.pm2_env?.pm_cwd || '') === `/var/www/fanmind-releases/${process.env.EXPECTED_RELEASE}`,
          };
          if (after.status !== 'online' || !after.cwdMatches || after.pid < 1) {
            throw new Error('pm2_post_activation_invalid');
          }
          console.log(`PM2_APP_PID_UNCHANGED=${before.pid === after.pid ? 'yes' : 'no'}`);
          console.log(`PM2_APP_RESTART_COUNT_UNCHANGED=${before.restarts === after.restarts ? 'yes' : 'no'}`);
          console.log(`PM2_APP_POST_ACTIVATION_RESTART_COUNT=${after.restarts}`);
          if (before.pid !== after.pid || before.restarts !== after.restarts) {
            throw new Error('pm2_app_changed_during_service_adoption');
          }
          NODE
          rm -f "$after_snapshot"

          curl -fsSL --max-time 15 https://fanmind.ch/api/health | node -e '
            let input="";
            process.stdin.on("data", chunk => input += chunk);
            process.stdin.on("end", () => {
              const payload = JSON.parse(input);
              const checks = Array.isArray(payload.checks) ? payload.checks : [];
              process.exit(payload.status === "healthy" && checks.length >= 7 && checks.every(item => item?.status === "healthy") ? 0 : 1);
            });
          '
          echo 'PUBLIC_HEALTH_AFTER_PM2_ADOPTION=healthy' | tee -a "$report"
          echo 'PM2_STARTUP_ACTIVATION_RESULT=success' | tee -a "$report"

      - name: Upload sanitized PM2 startup evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fanmind-pm2-startup-activation
          path: fanmind-pm2-startup-activation.txt
          if-no-files-found: error
          retention-days: 14
