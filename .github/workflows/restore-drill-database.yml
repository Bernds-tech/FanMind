name: FanMind Isolated Database Restore Drill

on:
  workflow_dispatch:
    inputs:
      reviewed_commit:
        description: 'Exact reviewed main commit containing the restore controls'
        required: true
        type: string
      source_production_commit:
        description: 'Exact Production commit recorded inside the selected full backup'
        required: true
        type: string
      confirmation:
        description: 'Type run-isolated-database-restore to restore only to the disposable target'
        required: true
        type: string

concurrency:
  group: fanmind-restore-drill-write
  cancel-in-progress: false

permissions: {}

jobs:
  validate-dispatch:
    name: Reject an invalid database-restore dispatch
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Validate main, reviewed commits, and the exact confirmation
        shell: /usr/bin/bash --noprofile --norc -p -euo pipefail {0}
        env:
          REVIEWED_COMMIT: ${{ inputs.reviewed_commit }}
          SOURCE_PRODUCTION_COMMIT: ${{ inputs.source_production_commit }}
          REQUESTED_CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          [[ "$GITHUB_REF" == 'refs/heads/main' ]]
          [[ "$REVIEWED_COMMIT" == "$GITHUB_SHA" ]]
          [[ "$REVIEWED_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          [[ "$SOURCE_PRODUCTION_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          [[ "$REQUESTED_CONFIRMATION" == 'run-isolated-database-restore' ]]

  verify-restore-host:
    name: Verify the isolated restore host before loading the environment
    needs: validate-dispatch
    runs-on:
      group: fanmind-restore-drill
      labels: [self-hosted, fanmind-restore, fanmind-restore-01, linux, x64]
    timeout-minutes: 10
    env:
      ALL_PROXY: ''
      PATH: /opt/fanmind-restore/node-v24.19.0-linux-x64/bin:/usr/lib/postgresql/17/bin:/usr/bin:/bin
      RESTORE_HOST_GATE_SHA256: c60f0ec5278de5ec30fba44c9568e343dc0c0277500f824a1dd73993d1c8e117
      TMPDIR: ${{ runner.temp }}
      BASH_ENV: ''
      BASHOPTS: ''
      BASH_XTRACEFD: ''
      CURL_CA_BUNDLE: ''
      ENV: ''
      GCONV_PATH: ''
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_GLOBAL: /dev/null
      GIT_CONFIG_KEY_0: core.hooksPath
      GIT_CONFIG_PARAMETERS: ''
      GIT_CONFIG_SYSTEM: /dev/null
      GIT_CONFIG_VALUE_0: /dev/null
      GIT_CURL_VERBOSE: ''
      GIT_EXEC_PATH: ''
      GIT_SSL_CAINFO: ''
      GIT_SSL_CAPATH: ''
      GIT_SSL_NO_VERIFY: 'false'
      GIT_TRACE: ''
      GIT_TRACE_CURL: ''
      GIT_TRACE_CURL_NO_DATA: ''
      GIT_TRACE_FSMONITOR: ''
      GIT_TRACE_PACK_ACCESS: ''
      GIT_TRACE_PACKFILE: ''
      GIT_TRACE_PACKET: ''
      GIT_TRACE_PERFORMANCE: ''
      GIT_TRACE_REFS: ''
      GIT_TRACE_REDACT: 'true'
      GIT_TRACE_SETUP: ''
      GIT_TRACE_SHALLOW: ''
      GIT_TRACE2: ''
      GIT_TRACE2_BRIEF: ''
      GIT_TRACE2_CONFIG_PARAMS: ''
      GIT_TRACE2_ENV_VARS: ''
      GIT_TRACE2_EVENT: ''
      GIT_TRACE2_EVENT_BRIEF: ''
      GIT_TRACE2_EVENT_NESTING: ''
      GIT_TRACE2_PARENT_NAME: ''
      GIT_TRACE2_PERF: ''
      GIT_TRACE2_PERF_BRIEF: ''
      HTTP_PROXY: ''
      HTTPS_PROXY: ''
      LD_AUDIT: ''
      LD_LIBRARY_PATH: ''
      LD_PRELOAD: ''
      NODE_DEBUG: ''
      NODE_DEBUG_NATIVE: ''
      NODE_OPTIONS: ''
      NODE_PATH: ''
      NODE_EXTRA_CA_CERTS: ''
      NODE_TLS_REJECT_UNAUTHORIZED: '1'
      NO_PROXY: ''
      NPM_CONFIG_SCRIPT_SHELL: ''
      OPENSSL_CONF: ''
      OPENSSL_ENGINES: ''
      OPENSSL_MODULES: ''
      PYTHONPATH: ''
      REQUESTS_CA_BUNDLE: ''
      PS4: ''
      SHELLOPTS: ''
      SSL_CERT_DIR: ''
      SSL_CERT_FILE: ''
      all_proxy: ''
      http_proxy: ''
      https_proxy: ''
      no_proxy: ''
    steps:
      - name: Verify the preinstalled isolated restore host gate without Restore secrets
        shell: /usr/bin/bash --noprofile --norc -p -euo pipefail {0}
        env:
          BASH_ENV: ''
          ENV: ''
          LD_LIBRARY_PATH: ''
          LD_PRELOAD: ''
          NODE_OPTIONS: ''
          NODE_PATH: ''
          NPM_CONFIG_SCRIPT_SHELL: ''
          PYTHONPATH: ''
          FANMIND_ENABLE_NON_PRODUCTION_WRITES: 'false'
          FANMIND_NON_PRODUCTION_WRITE_ACK: ''
          FANMIND_ENABLE_RESTORE_DRILL: 'false'
          FANMIND_RESTORE_TARGET_ACK: ''
          FANMIND_RESTORE_HOST_CONFIRMATION: verify-isolated-restore-host
          NEXT_PUBLIC_SUPABASE_URL: ''
          FANMIND_TARGET_SUPABASE_PROJECT_REF: ''
          FANMIND_PRODUCTION_SUPABASE_PROJECT_REF: ''
          PGHOST: ''
          PGPORT: ''
          PGDATABASE: ''
          PGUSER: ''
          PGPASSWORD: ''
          PGPASSFILE: ''
          PGHOSTADDR: ''
          PGSERVICE: ''
          PGSERVICEFILE: ''
          PGSSLMODE: ''
          PGSSLROOTCERT: ''
          PGGSSENCMODE: ''
          PGOPTIONS: ''
          TMPDIR: ${{ runner.temp }}
        run: |
          umask 077
          NODE_PATH=/opt/fanmind-restore/node-v24.19.0-linux-x64/bin/node
          GATE_PATH=/opt/fanmind-restore/restore-host-readiness.mjs
          [[ -f "$GATE_PATH" && ! -L "$GATE_PATH" ]]
          [[ "$(/usr/bin/realpath -- "$GATE_PATH")" == "$GATE_PATH" ]]
          [[ ! -w "$GATE_PATH" ]]
          for GATE_PARENT in /opt /opt/fanmind-restore /opt/fanmind-restore/node-v24.19.0-linux-x64 /opt/fanmind-restore/node-v24.19.0-linux-x64/bin; do
            [[ -d "$GATE_PARENT" && ! -L "$GATE_PARENT" && ! -w "$GATE_PARENT" ]]
            [[ "$(/usr/bin/realpath -- "$GATE_PARENT")" == "$GATE_PARENT" ]]
            read -r PARENT_OWNER PARENT_MODE <<< "$(/usr/bin/stat -Lc '%u %a' -- "$GATE_PARENT")"
            [[ "$PARENT_OWNER" == 0 && "$PARENT_MODE" =~ ^[0-7]{3,4}$ ]]
            (( (8#$PARENT_MODE & 07022) == 0 ))
          done
          [[ -f "$NODE_PATH" && ! -L "$NODE_PATH" && ! -w "$NODE_PATH" ]]
          [[ "$(/usr/bin/realpath -- "$NODE_PATH")" == "$NODE_PATH" ]]
          read -r NODE_OWNER NODE_MODE <<< "$(/usr/bin/stat -Lc '%u %a' -- "$NODE_PATH")"
          [[ "$NODE_OWNER" == 0 && "$NODE_MODE" =~ ^[0-7]{3,4}$ ]]
          (( (8#$NODE_MODE & 07022) == 0 ))
          [[ "$(/usr/bin/env -i LANG=C LC_ALL=C "$NODE_PATH" --version)" == v24.19.0 ]]
          read -r GATE_OWNER GATE_MODE <<< "$(/usr/bin/stat -Lc '%u %a' -- "$GATE_PATH")"
          [[ "$GATE_OWNER" == 0 ]]
          [[ "$GATE_MODE" =~ ^[0-7]{3,4}$ ]]
          (( (8#$GATE_MODE & 07022) == 0 ))
          GATE_DIGEST="$(/usr/bin/sha256sum --binary -- "$GATE_PATH")"
          [[ "${GATE_DIGEST%% *}" == "$RESTORE_HOST_GATE_SHA256" ]]
          /usr/bin/env -i \
            LANG=C \
            LC_ALL=C \
            GITHUB_ACTIONS="$GITHUB_ACTIONS" \
            GITHUB_EVENT_NAME="$GITHUB_EVENT_NAME" \
            GITHUB_REF="$GITHUB_REF" \
            GITHUB_REPOSITORY="$GITHUB_REPOSITORY" \
            GITHUB_WORKSPACE="$GITHUB_WORKSPACE" \
            RUNNER_ARCH="$RUNNER_ARCH" \
            RUNNER_ENVIRONMENT="$RUNNER_ENVIRONMENT" \
            RUNNER_NAME="$RUNNER_NAME" \
            RUNNER_OS="$RUNNER_OS" \
            RUNNER_TEMP="$RUNNER_TEMP" \
            TMPDIR="$RUNNER_TEMP" \
            FANMIND_ENABLE_NON_PRODUCTION_WRITES=false \
            FANMIND_NON_PRODUCTION_WRITE_ACK= \
            FANMIND_ENABLE_RESTORE_DRILL=false \
            FANMIND_RESTORE_TARGET_ACK= \
            FANMIND_RESTORE_HOST_CONFIRMATION=verify-isolated-restore-host \
            "$NODE_PATH" \
            "$GATE_PATH"

  restore-isolated-database:
    name: Restore verified full backup to the empty disposable database
    needs: verify-restore-host
    runs-on:
      group: fanmind-restore-drill
      labels: [self-hosted, fanmind-restore, fanmind-restore-01, linux, x64]
    timeout-minutes: 60
    environment: restore-drill
    permissions:
      contents: read
    env:
      ALL_PROXY: ''
      PATH: /opt/fanmind-restore/node-v24.19.0-linux-x64/bin:/usr/lib/postgresql/17/bin:/usr/bin:/bin
      RESTORE_HOST_GATE_SHA256: c60f0ec5278de5ec30fba44c9568e343dc0c0277500f824a1dd73993d1c8e117
      TMPDIR: ${{ runner.temp }}
      BASH_ENV: ''
      BASHOPTS: ''
      BASH_XTRACEFD: ''
      CURL_CA_BUNDLE: ''
      ENV: ''
      GCONV_PATH: ''
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_GLOBAL: /dev/null
      GIT_CONFIG_KEY_0: core.hooksPath
      GIT_CONFIG_PARAMETERS: ''
      GIT_CONFIG_SYSTEM: /dev/null
      GIT_CONFIG_VALUE_0: /dev/null
      GIT_CURL_VERBOSE: ''
      GIT_EXEC_PATH: ''
      GIT_SSL_CAINFO: ''
      GIT_SSL_CAPATH: ''
      GIT_SSL_NO_VERIFY: 'false'
      GIT_TRACE: ''
      GIT_TRACE_CURL: ''
      GIT_TRACE_CURL_NO_DATA: ''
      GIT_TRACE_FSMONITOR: ''
      GIT_TRACE_PACK_ACCESS: ''
      GIT_TRACE_PACKFILE: ''
      GIT_TRACE_PACKET: ''
      GIT_TRACE_PERFORMANCE: ''
      GIT_TRACE_REFS: ''
      GIT_TRACE_REDACT: 'true'
      GIT_TRACE_SETUP: ''
      GIT_TRACE_SHALLOW: ''
      GIT_TRACE2: ''
      GIT_TRACE2_BRIEF: ''
      GIT_TRACE2_CONFIG_PARAMS: ''
      GIT_TRACE2_ENV_VARS: ''
      GIT_TRACE2_EVENT: ''
      GIT_TRACE2_EVENT_BRIEF: ''
      GIT_TRACE2_EVENT_NESTING: ''
      GIT_TRACE2_PARENT_NAME: ''
      GIT_TRACE2_PERF: ''
      GIT_TRACE2_PERF_BRIEF: ''
      HTTP_PROXY: ''
      HTTPS_PROXY: ''
      LD_AUDIT: ''
      LD_LIBRARY_PATH: ''
      LD_PRELOAD: ''
      NODE_DEBUG: ''
      NODE_DEBUG_NATIVE: ''
      NODE_OPTIONS: ''
      NODE_PATH: ''
      NODE_EXTRA_CA_CERTS: ''
      NODE_TLS_REJECT_UNAUTHORIZED: '1'
      NO_PROXY: ''
      NPM_CONFIG_SCRIPT_SHELL: ''
      OPENSSL_CONF: ''
      OPENSSL_ENGINES: ''
      OPENSSL_MODULES: ''
      PYTHONPATH: ''
      REQUESTS_CA_BUNDLE: ''
      PS4: ''
      SHELLOPTS: ''
      SSL_CERT_DIR: ''
      SSL_CERT_FILE: ''
      all_proxy: ''
      http_proxy: ''
      https_proxy: ''
      no_proxy: ''
    steps:
      - name: Re-attest the preinstalled gate before checkout or environment-secret use
        shell: /usr/bin/bash --noprofile --norc -p -euo pipefail {0}
        env:
          BASH_ENV: ''
          ENV: ''
          LD_LIBRARY_PATH: ''
          LD_PRELOAD: ''
          NODE_OPTIONS: ''
          NODE_PATH: ''
          NPM_CONFIG_SCRIPT_SHELL: ''
          PYTHONPATH: ''
          FANMIND_ENABLE_NON_PRODUCTION_WRITES: 'false'
          FANMIND_NON_PRODUCTION_WRITE_ACK: ''
          FANMIND_ENABLE_RESTORE_DRILL: 'false'
          FANMIND_RESTORE_TARGET_ACK: ''
          FANMIND_RESTORE_HOST_CONFIRMATION: verify-isolated-restore-host
          NEXT_PUBLIC_SUPABASE_URL: ''
          FANMIND_TARGET_SUPABASE_PROJECT_REF: ''
          FANMIND_PRODUCTION_SUPABASE_PROJECT_REF: ''
          PGHOST: ''
          PGPORT: ''
          PGDATABASE: ''
          PGUSER: ''
          PGPASSWORD: ''
          PGPASSFILE: ''
          PGHOSTADDR: ''
          PGSERVICE: ''
          PGSERVICEFILE: ''
          PGSSLMODE: ''
          PGSSLROOTCERT: ''
          PGGSSENCMODE: ''
          PGOPTIONS: ''
          TMPDIR: ${{ runner.temp }}
        run: |
          umask 077
          NODE_PATH=/opt/fanmind-restore/node-v24.19.0-linux-x64/bin/node
          GATE_PATH=/opt/fanmind-restore/restore-host-readiness.mjs
          [[ -f "$GATE_PATH" && ! -L "$GATE_PATH" ]]
          [[ "$(/usr/bin/realpath -- "$GATE_PATH")" == "$GATE_PATH" ]]
          [[ ! -w "$GATE_PATH" ]]
          for GATE_PARENT in /opt /opt/fanmind-restore /opt/fanmind-restore/node-v24.19.0-linux-x64 /opt/fanmind-restore/node-v24.19.0-linux-x64/bin; do
            [[ -d "$GATE_PARENT" && ! -L "$GATE_PARENT" && ! -w "$GATE_PARENT" ]]
            [[ "$(/usr/bin/realpath -- "$GATE_PARENT")" == "$GATE_PARENT" ]]
            read -r PARENT_OWNER PARENT_MODE <<< "$(/usr/bin/stat -Lc '%u %a' -- "$GATE_PARENT")"
            [[ "$PARENT_OWNER" == 0 && "$PARENT_MODE" =~ ^[0-7]{3,4}$ ]]
            (( (8#$PARENT_MODE & 07022) == 0 ))
          done
          [[ -f "$NODE_PATH" && ! -L "$NODE_PATH" && ! -w "$NODE_PATH" ]]
          [[ "$(/usr/bin/realpath -- "$NODE_PATH")" == "$NODE_PATH" ]]
          read -r NODE_OWNER NODE_MODE <<< "$(/usr/bin/stat -Lc '%u %a' -- "$NODE_PATH")"
          [[ "$NODE_OWNER" == 0 && "$NODE_MODE" =~ ^[0-7]{3,4}$ ]]
          (( (8#$NODE_MODE & 07022) == 0 ))
          [[ "$(/usr/bin/env -i LANG=C LC_ALL=C "$NODE_PATH" --version)" == v24.19.0 ]]
          read -r GATE_OWNER GATE_MODE <<< "$(/usr/bin/stat -Lc '%u %a' -- "$GATE_PATH")"
          [[ "$GATE_OWNER" == 0 ]]
          [[ "$GATE_MODE" =~ ^[0-7]{3,4}$ ]]
          (( (8#$GATE_MODE & 07022) == 0 ))
          GATE_DIGEST="$(/usr/bin/sha256sum --binary -- "$GATE_PATH")"
          [[ "${GATE_DIGEST%% *}" == "$RESTORE_HOST_GATE_SHA256" ]]
          /usr/bin/env -i \
            LANG=C \
            LC_ALL=C \
            GITHUB_ACTIONS="$GITHUB_ACTIONS" \
            GITHUB_EVENT_NAME="$GITHUB_EVENT_NAME" \
            GITHUB_REF="$GITHUB_REF" \
            GITHUB_REPOSITORY="$GITHUB_REPOSITORY" \
            GITHUB_WORKSPACE="$GITHUB_WORKSPACE" \
            RUNNER_ARCH="$RUNNER_ARCH" \
            RUNNER_ENVIRONMENT="$RUNNER_ENVIRONMENT" \
            RUNNER_NAME="$RUNNER_NAME" \
            RUNNER_OS="$RUNNER_OS" \
            RUNNER_TEMP="$RUNNER_TEMP" \
            TMPDIR="$RUNNER_TEMP" \
            FANMIND_ENABLE_NON_PRODUCTION_WRITES=false \
            FANMIND_NON_PRODUCTION_WRITE_ACK= \
            FANMIND_ENABLE_RESTORE_DRILL=false \
            FANMIND_RESTORE_TARGET_ACK= \
            FANMIND_RESTORE_HOST_CONFIRMATION=verify-isolated-restore-host \
            "$NODE_PATH" \
            "$GATE_PATH"

      - name: Checkout exact reviewed main commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.reviewed_commit }}
          persist-credentials: false
          set-safe-directory: false

      - name: Verify isolated resources without writes
        env:
          FANMIND_RUNTIME_ENVIRONMENT: staging
          NEXT_PUBLIC_APP_URL: ${{ vars.FANMIND_RESTORE_APP_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.FANMIND_RESTORE_SUPABASE_URL }}
          FANMIND_TARGET_SUPABASE_PROJECT_REF: ${{ vars.FANMIND_RESTORE_SUPABASE_PROJECT_REF }}
          FANMIND_PRODUCTION_SUPABASE_PROJECT_REF: ${{ vars.FANMIND_PRODUCTION_SUPABASE_PROJECT_REF }}
          FANMIND_RESTORE_TARGET_DB_HOST: ${{ secrets.FANMIND_RESTORE_TARGET_DB_HOST }}
          FANMIND_RESTORE_TARGET_DB_PORT: ${{ vars.FANMIND_RESTORE_TARGET_DB_PORT }}
          FANMIND_RESTORE_TARGET_DB_NAME: ${{ vars.FANMIND_RESTORE_TARGET_DB_NAME }}
          FANMIND_RESTORE_TARGET_DB_USER: ${{ secrets.FANMIND_RESTORE_TARGET_DB_USER }}
          FANMIND_PRODUCTION_DB_HOST: ${{ secrets.FANMIND_PRODUCTION_DB_HOST }}
          FANMIND_PRODUCTION_DB_PORT: ${{ vars.FANMIND_PRODUCTION_DB_PORT }}
          FANMIND_PRODUCTION_DB_NAME: ${{ vars.FANMIND_PRODUCTION_DB_NAME }}
          FANMIND_PRODUCTION_DB_USER: ${{ secrets.FANMIND_PRODUCTION_DB_USER }}
          FANMIND_RESTORE_ARTIFACT_PATH: ${{ secrets.FANMIND_RESTORE_ARTIFACT_PATH }}
          FANMIND_ENABLE_NON_PRODUCTION_WRITES: 'false'
          FANMIND_NON_PRODUCTION_WRITE_ACK: ''
          FANMIND_ENABLE_RESTORE_DRILL: 'false'
          FANMIND_RESTORE_TARGET_ACK: ''
          FANMIND_RESTORE_READINESS_CONFIRM: verify-isolated-restore-resources
          PGHOST: ''
          PGPORT: ''
          PGDATABASE: ''
          PGUSER: ''
          PGPASSWORD: ''
          PGPASSFILE: ''
          PGHOSTADDR: ''
          PGSERVICE: ''
          PGSERVICEFILE: ''
        shell: /usr/bin/bash --noprofile --norc -p -euo pipefail {0}
        run: /opt/fanmind-restore/node-v24.19.0-linux-x64/bin/node scripts/operations/restore-drill-resource-readiness.mjs

      - name: Verify isolated PostgreSQL 17 target read-only
        env:
          FANMIND_RUNTIME_ENVIRONMENT: staging
          NEXT_PUBLIC_APP_URL: ${{ vars.FANMIND_RESTORE_APP_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.FANMIND_RESTORE_SUPABASE_URL }}
          FANMIND_TARGET_SUPABASE_PROJECT_REF: ${{ vars.FANMIND_RESTORE_SUPABASE_PROJECT_REF }}
          FANMIND_PRODUCTION_SUPABASE_PROJECT_REF: ${{ vars.FANMIND_PRODUCTION_SUPABASE_PROJECT_REF }}
          FANMIND_RESTORE_TARGET_DB_HOST: ${{ secrets.FANMIND_RESTORE_TARGET_DB_HOST }}
          FANMIND_RESTORE_TARGET_DB_PORT: ${{ vars.FANMIND_RESTORE_TARGET_DB_PORT }}
          FANMIND_RESTORE_TARGET_DB_NAME: ${{ vars.FANMIND_RESTORE_TARGET_DB_NAME }}
          FANMIND_RESTORE_TARGET_DB_USER: ${{ secrets.FANMIND_RESTORE_TARGET_DB_USER }}
          FANMIND_PRODUCTION_DB_HOST: ${{ secrets.FANMIND_PRODUCTION_DB_HOST }}
          FANMIND_PRODUCTION_DB_PORT: ${{ vars.FANMIND_PRODUCTION_DB_PORT }}
          FANMIND_PRODUCTION_DB_NAME: ${{ vars.FANMIND_PRODUCTION_DB_NAME }}
          FANMIND_PRODUCTION_DB_USER: ${{ secrets.FANMIND_PRODUCTION_DB_USER }}
          FANMIND_RESTORE_TARGET_COMPATIBILITY_CONFIRM: verify-read-only-restore-target
          FANMIND_RESTORE_TARGET_PGPASSFILE_PATH: ${{ secrets.FANMIND_RESTORE_TARGET_PGPASSFILE_PATH }}
          FANMIND_RESTORE_TARGET_CA_CERT_PATH: ${{ secrets.FANMIND_RESTORE_TARGET_CA_CERT_PATH }}
          FANMIND_OPERATIONAL_TEST_MODE: ''
          FANMIND_PSQL_BIN: ''
          PGHOST: ''
          PGPORT: ''
          PGDATABASE: ''
          PGUSER: ''
          PGPASSWORD: ''
          PGPASSFILE: ''
          PGHOSTADDR: ''
          PGSERVICE: ''
          PGSERVICEFILE: ''
        shell: /usr/bin/bash --noprofile --norc -p -euo pipefail {0}
        run: /opt/fanmind-restore/node-v24.19.0-linux-x64/bin/node scripts/operations/restore-target-compatibility.mjs

      - name: Decrypt privately and restore the exact database dump
        env:
          FANMIND_RUNTIME_ENVIRONMENT: staging
          NEXT_PUBLIC_APP_URL: ${{ vars.FANMIND_RESTORE_APP_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.FANMIND_RESTORE_SUPABASE_URL }}
          FANMIND_TARGET_SUPABASE_PROJECT_REF: ${{ vars.FANMIND_RESTORE_SUPABASE_PROJECT_REF }}
          FANMIND_PRODUCTION_SUPABASE_PROJECT_REF: ${{ vars.FANMIND_PRODUCTION_SUPABASE_PROJECT_REF }}
          FANMIND_RESTORE_TARGET_DB_HOST: ${{ secrets.FANMIND_RESTORE_TARGET_DB_HOST }}
          FANMIND_RESTORE_TARGET_DB_PORT: ${{ vars.FANMIND_RESTORE_TARGET_DB_PORT }}
          FANMIND_RESTORE_TARGET_DB_NAME: ${{ vars.FANMIND_RESTORE_TARGET_DB_NAME }}
          FANMIND_RESTORE_TARGET_DB_USER: ${{ secrets.FANMIND_RESTORE_TARGET_DB_USER }}
          FANMIND_PRODUCTION_DB_HOST: ${{ secrets.FANMIND_PRODUCTION_DB_HOST }}
          FANMIND_PRODUCTION_DB_PORT: ${{ vars.FANMIND_PRODUCTION_DB_PORT }}
          FANMIND_PRODUCTION_DB_NAME: ${{ vars.FANMIND_PRODUCTION_DB_NAME }}
          FANMIND_PRODUCTION_DB_USER: ${{ secrets.FANMIND_PRODUCTION_DB_USER }}
          FANMIND_RESTORE_ARTIFACT_PATH: ${{ secrets.FANMIND_RESTORE_ARTIFACT_PATH }}
          FANMIND_RESTORE_PRIVATE_ROOT: ${{ runner.temp }}/fanmind-restore-${{ github.run_id }}-${{ github.run_attempt }}
          FANMIND_ENABLE_NON_PRODUCTION_WRITES: 'true'
          FANMIND_NON_PRODUCTION_WRITE_ACK: I_UNDERSTAND_NON_PRODUCTION_ONLY
          FANMIND_ENABLE_RESTORE_DRILL: 'true'
          FANMIND_RESTORE_TARGET_ACK: I_UNDERSTAND_EMPTY_DISPOSABLE_DATABASE_ONLY
          FANMIND_RESTORE_PRODUCTION_COMMIT: ${{ inputs.source_production_commit }}
          FANMIND_RESTORE_AGE_IDENTITY_PATH: ${{ secrets.FANMIND_RESTORE_AGE_IDENTITY_PATH }}
          FANMIND_OPERATIONAL_TEST_MODE: ''
          FANMIND_PG_RESTORE_BIN: ''
          FANMIND_PSQL_BIN: ''
          PGHOST: ${{ secrets.FANMIND_RESTORE_TARGET_DB_HOST }}
          PGPORT: ${{ vars.FANMIND_RESTORE_TARGET_DB_PORT }}
          PGDATABASE: ${{ vars.FANMIND_RESTORE_TARGET_DB_NAME }}
          PGUSER: ${{ secrets.FANMIND_RESTORE_TARGET_DB_USER }}
          PGPASSFILE: ${{ secrets.FANMIND_RESTORE_TARGET_PGPASSFILE_PATH }}
          PGPASSWORD: ''
          PGHOSTADDR: ''
          PGSERVICE: ''
          PGSERVICEFILE: ''
          PGSSLMODE: verify-full
          PGSSLROOTCERT: ${{ secrets.FANMIND_RESTORE_TARGET_CA_CERT_PATH }}
          PGGSSENCMODE: disable
          PGOPTIONS: ''
        shell: /usr/bin/bash --noprofile --norc -p -euo pipefail {0}
        run: |
          umask 077
          export PATH=/opt/fanmind-restore/node-v24.19.0-linux-x64/bin:/usr/lib/postgresql/17/bin:/usr/bin:/bin
          [[ "$FANMIND_RESTORE_PRODUCTION_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          [[ ! -e "$FANMIND_RESTORE_PRIVATE_ROOT" && ! -L "$FANMIND_RESTORE_PRIVATE_ROOT" ]]
          /usr/bin/mkdir -m 0700 -- "$FANMIND_RESTORE_PRIVATE_ROOT"
          /usr/bin/mkdir -m 0700 -- \
            "$FANMIND_RESTORE_PRIVATE_ROOT/work" \
            "$FANMIND_RESTORE_PRIVATE_ROOT/receipts"
          TMPDIR="$FANMIND_RESTORE_PRIVATE_ROOT/work"
          export TMPDIR

          FANMIND_RESTORE_DRILL_ID="$(/usr/bin/date -u +'%Y-%m-%d')-github-${GITHUB_RUN_ID}"
          FANMIND_RESTORE_DISPOSABLE_TARGET_ID="$(/opt/fanmind-restore/node-v24.19.0-linux-x64/bin/node -e 'process.stdout.write(require("node:crypto").randomUUID())')"
          FANMIND_FULL_BACKUP_RESTORE_RECEIPT_PATH="$FANMIND_RESTORE_PRIVATE_ROOT/receipts/full-backup-receipt.json"
          FANMIND_RESTORE_RUNNER_RECEIPT_PATH="$FANMIND_RESTORE_PRIVATE_ROOT/receipts/restore-runner-receipt.json"
          FANMIND_RESTORE_DATABASE_POSTCHECK_RECEIPT_PATH="$FANMIND_RESTORE_PRIVATE_ROOT/receipts/database-postcheck-receipt.json"
          RESTORE_DUMP_PATH="$FANMIND_RESTORE_PRIVATE_ROOT/work/verified-database.dump"
          export \
            FANMIND_RESTORE_DRILL_ID \
            FANMIND_RESTORE_DISPOSABLE_TARGET_ID \
            FANMIND_FULL_BACKUP_RESTORE_RECEIPT_PATH \
            FANMIND_RESTORE_RUNNER_RECEIPT_PATH \
            FANMIND_RESTORE_DATABASE_POSTCHECK_RECEIPT_PATH

          /opt/fanmind-restore/node-v24.19.0-linux-x64/bin/node scripts/operations/restore-target-preflight.mjs >/dev/null
          /opt/fanmind-restore/node-v24.19.0-linux-x64/bin/node scripts/operations/verify-backup-artifact.mjs \
            --artifact "$FANMIND_RESTORE_ARTIFACT_PATH" \
            --identity "$FANMIND_RESTORE_AGE_IDENTITY_PATH" \
            --age-bin /usr/bin/age \
            --pg-restore-bin /usr/lib/postgresql/17/bin/pg_restore \
            --tar-bin /usr/bin/tar \
            --restore-dump-output "$RESTORE_DUMP_PATH" \
            --restore-receipt-output "$FANMIND_FULL_BACKUP_RESTORE_RECEIPT_PATH" \
            >/dev/null
          /usr/bin/bash -p scripts/operations/run-database-restore-drill.sh "$RESTORE_DUMP_PATH"

          printf 'RESTORE_DATABASE_DRILL=PASS\n'
          printf 'RESTORE_DATABASE_RECEIPTS=private_short_lived_artifact\n'
          printf 'RESTORE_DISPOSABLE_TARGET_CLEANUP=required\n'
          printf 'SECRETS_WURDEN_NICHT_AUSGEGEBEN=true\n'

      - name: Upload private database restore receipts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fanmind-restore-database-receipts-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/fanmind-restore-${{ github.run_id }}-${{ github.run_attempt }}/receipts
          if-no-files-found: error
          retention-days: 3

      - name: Remove plaintext dump and private receipts from the runner
        if: ${{ always() }}
        env:
          FANMIND_RESTORE_PRIVATE_ROOT: ${{ runner.temp }}/fanmind-restore-${{ github.run_id }}-${{ github.run_attempt }}
        shell: /usr/bin/bash --noprofile --norc -p -euo pipefail {0}
        run: |
          if [[ ! -e "$FANMIND_RESTORE_PRIVATE_ROOT" && ! -L "$FANMIND_RESTORE_PRIVATE_ROOT" ]]; then
            exit 0
          fi
          [[ -d "$FANMIND_RESTORE_PRIVATE_ROOT" && ! -L "$FANMIND_RESTORE_PRIVATE_ROOT" ]]
          PRIVATE_ROOT_CANONICAL="$(/usr/bin/realpath -- "$FANMIND_RESTORE_PRIVATE_ROOT")"
          PRIVATE_ROOT_METADATA="$(/usr/bin/stat -Lc '%u %a' -- "$FANMIND_RESTORE_PRIVATE_ROOT")"
          read -r PRIVATE_ROOT_OWNER PRIVATE_ROOT_MODE <<< "$PRIVATE_ROOT_METADATA"
          [[ "$PRIVATE_ROOT_CANONICAL" == "$FANMIND_RESTORE_PRIVATE_ROOT" ]]
          [[ "$PRIVATE_ROOT_OWNER" == "$(/usr/bin/id -u)" ]]
          [[ "$PRIVATE_ROOT_MODE" =~ ^[0-7]{3,4}$ ]]
          (( (8#$PRIVATE_ROOT_MODE & 077) == 0 ))
          for candidate in \
            "$FANMIND_RESTORE_PRIVATE_ROOT/work/verified-database.dump" \
            "$FANMIND_RESTORE_PRIVATE_ROOT/receipts/full-backup-receipt.json" \
            "$FANMIND_RESTORE_PRIVATE_ROOT/receipts/restore-runner-receipt.json" \
            "$FANMIND_RESTORE_PRIVATE_ROOT/receipts/database-postcheck-receipt.json"
          do
            if [[ -e "$candidate" || -L "$candidate" ]]; then
              /usr/bin/unlink -- "$candidate"
            fi
          done
          /usr/bin/rmdir -- "$FANMIND_RESTORE_PRIVATE_ROOT/work"
          /usr/bin/rmdir -- "$FANMIND_RESTORE_PRIVATE_ROOT/receipts"
          /usr/bin/rmdir -- "$FANMIND_RESTORE_PRIVATE_ROOT"
          [[ ! -e "$FANMIND_RESTORE_PRIVATE_ROOT" && ! -L "$FANMIND_RESTORE_PRIVATE_ROOT" ]]
