name: Temporary Product Truth Build Diagnostic

on:
  push:
    branches:
      - p1/product-truth-followups-whatsapp-20260725
    paths:
      - .github/workflows/temp-diagnose-product-truth-build.yml

permissions:
  contents: write

jobs:
  diagnose-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Checkout target branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: p1/product-truth-followups-whatsapp-20260725
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v4
        with:
          node-version: 24
          cache: npm

      - name: Install and capture build result
        shell: bash
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          set +e
          npm run build > /tmp/fanmind-build.log 2>&1
          status=$?
          set -e
          mkdir -p diagnostics
          {
            echo "BUILD_EXIT_STATUS=${status}"
            echo "--- LAST 160 BUILD LINES ---"
            tail -n 160 /tmp/fanmind-build.log
          } > diagnostics/product-truth-build-tail.txt
          if grep -Eiq '(sk-[A-Za-z0-9]|service_role|stripe.*secret|authorization:|bearer [A-Za-z0-9])' diagnostics/product-truth-build-tail.txt; then
            echo "Potential secret-like output detected; refusing to persist diagnostic." >&2
            rm -f diagnostics/product-truth-build-tail.txt
            exit 1
          fi

      - name: Commit diagnostic only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Bernds-tech"
          git config user.email "270165082+Bernds-tech@users.noreply.github.com"
          git add diagnostics/product-truth-build-tail.txt
          git commit -m "Capture product-truth build diagnostic"
          git push origin HEAD:p1/product-truth-followups-whatsapp-20260725
