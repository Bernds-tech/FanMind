name: FanMind P1 PM2 Startup Failure Diagnostic

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
    paths:
      - ".github/workflows/ops-pm2-startup-failure-diagnostic-20260724.yml"

concurrency:
  group: fanmind-p1-pm2-startup-failure-diagnostic-20260724
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  diagnose:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'ops/controlled-ubuntu-reboot-20260724'
    runs-on:
      - self-hosted
      - fanmind-prod
      - exoscale
      - linux
      - x64
    timeout-minutes: 10
    env:
      REPORT_PATH: fanmind-pm2-startup-failure-diagnostic.txt

    steps:
      - name: Checkout trusted reboot branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ops/controlled-ubuntu-reboot-20260724
          fetch-depth: 1
          show-progress: false

      - name: Inspect failed PM2 systemd adoption without changing state
        shell: bash
        run: |
          set -euo pipefail
          report="$GITHUB_WORKSPACE/$REPORT_PATH"
          : > "$report"
          printf 'PM2_FAILURE_DIAGNOSTIC_UTC=%s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" | tee -a "$report"

          active="$(systemctl show pm2-ubuntu.service -p ActiveState --value)"
          sub="$(systemctl show pm2-ubuntu.service -p SubState --value)"
          result="$(systemctl show pm2-ubuntu.service -p Result --value)"
          exec_code="$(systemctl show pm2-ubuntu.service -p ExecMainCode --value)"
          exec_status="$(systemctl show pm2-ubuntu.service -p ExecMainStatus --value)"
          unit_type="$(systemctl show pm2-ubuntu.service -p Type --value)"
          user="$(systemctl show pm2-ubuntu.service -p User --value)"
          pid_file="$(systemctl show pm2-ubuntu.service -p PIDFile --value)"
          remain="$(systemctl show pm2-ubuntu.service -p RemainAfterExit --value)"
          guess="$(systemctl show pm2-ubuntu.service -p GuessMainPID --value)"
          exec_start="$(systemctl show pm2-ubuntu.service -p ExecStart --value)"

          echo "PM2_UNIT_ACTIVE_STATE=${active:-unknown}" | tee -a "$report"
          echo "PM2_UNIT_SUB_STATE=${sub:-unknown}" | tee -a "$report"
          echo "PM2_UNIT_RESULT=${result:-unknown}" | tee -a "$report"
          echo "PM2_UNIT_EXEC_MAIN_CODE=${exec_code:-unknown}" | tee -a "$report"
          echo "PM2_UNIT_EXEC_MAIN_STATUS=${exec_status:-unknown}" | tee -a "$report"
          echo "PM2_UNIT_TYPE=${unit_type:-unknown}" | tee -a "$report"
          echo "PM2_UNIT_USER_MATCH=$([ "$user" = ubuntu ] && echo yes || echo no)" | tee -a "$report"
          echo "PM2_UNIT_PIDFILE_PRESENT=$([ -n "$pid_file" ] && echo yes || echo no)" | tee -a "$report"
          echo "PM2_UNIT_PIDFILE_EXISTS=$([ -n "$pid_file" ] && [ -s "$pid_file" ] && echo yes || echo no)" | tee -a "$report"
          echo "PM2_UNIT_REMAIN_AFTER_EXIT=${remain:-unknown}" | tee -a "$report"
          echo "PM2_UNIT_GUESS_MAIN_PID=${guess:-unknown}" | tee -a "$report"
          echo "PM2_UNIT_EXECSTART_RESURRECT=$([[ "$exec_start" == *resurrect* ]] && echo yes || echo no)" | tee -a "$report"

          daemon_count="$(pgrep -u ubuntu -f 'PM2 v|PM2_HOME|Daemon\.js' 2>/dev/null | wc -l | tr -d ' ')"
          echo "PM2_DAEMON_PROCESS_COUNT=$daemon_count" | tee -a "$report"

          journal="$(sudo -n journalctl -u pm2-ubuntu.service -n 80 --no-pager -o cat 2>/dev/null || true)"
          JOURNAL="$journal" node <<'NODE' | tee -a "$report"
          const value = String(process.env.JOURNAL || '').toLowerCase();
          const checks = {
            PM2_JOURNAL_HAS_RESURRECT: /resurrect/.test(value),
            PM2_JOURNAL_HAS_ALREADY_RUNNING: /already|online/.test(value),
            PM2_JOURNAL_HAS_PIDFILE: /pid.?file/.test(value),
            PM2_JOURNAL_HAS_TIMEOUT: /timeout|timed out/.test(value),
            PM2_JOURNAL_HAS_PERMISSION: /permission|eacces|denied/.test(value),
            PM2_JOURNAL_HAS_EXIT_FAILURE: /failed|failure|exit-code/.test(value),
            PM2_JOURNAL_HAS_NO_PROCESS_FOUND: /no process found|no processes/.test(value),
          };
          for (const [key, present] of Object.entries(checks)) {
            console.log(`${key}=${present ? 'yes' : 'no'}`);
          }
          console.log('PM2_JOURNAL_RAW_TEXT_NOT_PRINTED=true');
          NODE

          pm2 jlist | node -e '
            let input="";
            process.stdin.on("data", chunk => input += chunk);
            process.stdin.on("end", () => {
              const rows = JSON.parse(input).filter(item => item?.name === "fanmind");
              const ok = rows.length === 1 && rows[0]?.pm2_env?.status === "online" && Number(rows[0]?.pid || 0) > 0;
              process.exit(ok ? 0 : 1);
            });
          '
          echo 'PM2_APPLICATION_CURRENTLY_HEALTHY=yes' | tee -a "$report"
          echo 'PM2_FAILURE_DIAGNOSTIC_RESULT=success' | tee -a "$report"

      - name: Upload sanitized PM2 failure diagnostic
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fanmind-pm2-startup-failure-diagnostic
          path: fanmind-pm2-startup-failure-diagnostic.txt
          if-no-files-found: error
          retention-days: 7
