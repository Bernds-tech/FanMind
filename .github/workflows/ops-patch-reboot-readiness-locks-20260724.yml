name: FanMind P1 Patch Reboot Readiness Locks

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
    paths:
      - ".github/workflows/ops-patch-reboot-readiness-locks-20260724.yml"
      - "scripts/operations/patch-reboot-readiness-locks-temp.py"

concurrency:
  group: fanmind-p1-patch-reboot-readiness-locks-20260724
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  patch:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'ops/controlled-ubuntu-reboot-20260724' &&
      github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout trusted reboot branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ops/controlled-ubuntu-reboot-20260724
          fetch-depth: 1
          show-progress: false

      - name: Replace process-only check with lock-aware policy
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/operations/patch-reboot-readiness-locks-temp.py
          git diff --check

      - name: Commit lock-aware readiness policy
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/operations/controlled-reboot-readiness-temp-20260724.mjs
          git diff --cached --quiet && { echo "Readiness patch produced no change" >&2; exit 1; }
          git commit -m "Use package locks for controlled reboot readiness"
          git push origin HEAD:ops/controlled-ubuntu-reboot-20260724
