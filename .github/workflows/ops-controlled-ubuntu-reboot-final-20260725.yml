name: FanMind P1 Controlled Ubuntu Reboot Final

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
    paths:
      - ".github/workflows/ops-controlled-ubuntu-reboot-final-20260725.yml"

concurrency:
  group: fanmind-p1-controlled-ubuntu-reboot-final-20260725
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  preflight:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'ops/controlled-ubuntu-reboot-20260724'
    runs-on:
      - self-hosted
      - fanmind-prod
      - exoscale
      - linux
      - x64
    timeout-minutes: 35
    outputs:
      boot_hash: ${{ steps.host.outputs.boot_hash }}
    env:
      EXPECTED_RELEASE: 6b8ba61a1786651713b2507340dc7b673811159d
      REPORT_PATH: fanmind-controlled-reboot-final-preflight.txt
    steps:
      - name: Checkout trusted operations branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ops/controlled-ubuntu-reboot-20260724
          fetch-depth: 1
          show-progress: false

      - name: Verify exact release and every required restart contract
        id: host
        shell: bash
        run: |
          set -euo pipefail
          report="$GITHUB_WORKSPACE/$REPORT_PATH"
          : > "$report"
          printf 'REBOOT_PREFLIGHT_UTC=%s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" | tee -a "$report"
          printf 'EXPECTED_RELEASE=%s\n' "$EXPECTED_RELEASE" | tee -a "$report"

          live_release="$(curl -fsSL --max-time 15 https://fanmind.ch/api/version | node -e '
            let input="";
            process.stdin.on("data", chunk => input += chunk);
            process.stdin.on("end", () => process.stdout.write(JSON.parse(input).releaseCommit || "missing"));
          ')"
          test "$live_release" = "$EXPECTED_RELEASE"
          test "$(git -C /var/www/fanmind rev-parse HEAD)" = "$EXPECTED_RELEASE"
          test "$(git -C /var/www/fanmind rev-parse origin/main)" = "$EXPECTED_RELEASE"
          test "$(readlink -f /var/www/fanmind-current)" = "/var/www/fanmind-releases/$EXPECTED_RELEASE"

          curl -fsSL --max-time 15 https://fanmind.ch/api/health | node -e '
            let input="";
            process.stdin.on("data", chunk => input += chunk);
            process.stdin.on("end", () => {
              const payload = JSON.parse(input);
              const checks = Array.isArray(payload.checks) ? payload.checks : [];
              process.exit(payload.status === "healthy" && checks.length >= 7 && checks.every(item => item?.status === "healthy") ? 0 : 1);
            });
          '

          sudo -n nginx -t >/dev/null 2>&1
          systemctl is-active --quiet nginx.service
          systemctl is-active --quiet pm2-ubuntu.service
          test "$(systemctl is-enabled pm2-ubuntu.service)" = enabled
          test "$(systemctl show pm2-ubuntu.service -p User --value)" = ubuntu
          test "$(systemctl show pm2-ubuntu.service -p Type --value)" = forking
          main_pid="$(systemctl show pm2-ubuntu.service -p MainPID --value)"
          test "$main_pid" -gt 1
          test -s /home/ubuntu/.pm2/pm2.pid
          test "$(tr -d '[:space:]' < /home/ubuntu/.pm2/pm2.pid)" = "$main_pid"
          test -d "/proc/$main_pid"
          test "$(stat -c %U "/proc/$main_pid")" = ubuntu

          systemctl is-active --quiet actions.runner.Bernds-tech-FanMind.fanmind-prod-01-exoscale.service
          test "$(systemctl is-enabled actions.runner.Bernds-tech-FanMind.fanmind-prod-01-exoscale.service)" = enabled
          systemctl is-active --quiet fanmind-backup-worker.service

          timers=(
            fanmind-backup-database.timer
            fanmind-backup-storage.timer
            fanmind-backup-server_config.timer
            fanmind-backup-full.timer
            fanmind-backup-retention.timer
            fanmind-demo-cleanup.timer
            fanmind-webhook-retention.timer
          )
          for timer in "${timers[@]}"; do
            systemctl is-active --quiet "$timer"
            test "$(systemctl is-enabled "$timer")" = enabled
          done

          command -v fuser >/dev/null
          package_locks=(
            /var/lib/dpkg/lock-frontend
            /var/lib/dpkg/lock
            /var/lib/apt/lists/lock
            /var/cache/apt/archives/lock
          )
          idle=no
          waited_seconds=0
          for attempt in $(seq 1 120); do
            busy=no
            systemctl is-active --quiet apt-daily.service && busy=yes
            systemctl is-active --quiet apt-daily-upgrade.service && busy=yes
            for lock in "${package_locks[@]}"; do
              if sudo -n fuser "$lock" >/dev/null 2>&1; then busy=yes; fi
            done
            if [ "$busy" = no ] && node -e '
              const os = require("node:os");
              const cpu = Math.max(os.cpus().length, 1);
              const load = os.loadavg()[0];
              process.exit(Number.isFinite(load) && load < Math.max(cpu * 4, 8) ? 0 : 1);
            '; then
              idle=yes
              break
            fi
            sleep 5
            waited_seconds=$((waited_seconds + 5))
          done
          test "$idle" = yes
          test -z "$(sudo -n dpkg --audit 2>/dev/null)"
          test -f /run/reboot-required

          available_kb="$(awk '/MemAvailable:/ {print $2}' /proc/meminfo)"
          test "$available_kb" -ge 262144
          root_available_kb="$(df -Pk / | awk 'NR==2 {print $4}')"
          test "$root_available_kb" -ge 1048576

          snapshot="$RUNNER_TEMP/fanmind-pm2-reboot-final-preflight.json"
          umask 077
          pm2 jlist > "$snapshot"
          SNAPSHOT="$snapshot" EXPECTED_RELEASE="$EXPECTED_RELEASE" node --input-type=module <<'NODE' | tee -a "$report"
          import fs from 'node:fs';
          const rows = JSON.parse(fs.readFileSync(process.env.SNAPSHOT, 'utf8')).filter(item => item?.name === 'fanmind');
          const app = rows.length === 1 ? rows[0] : null;
          const expected = `/var/www/fanmind-releases/${process.env.EXPECTED_RELEASE}`;
          const valid = rows.length === 1
            && app?.pm2_env?.status === 'online'
            && String(app?.pm2_env?.pm_cwd || '') === expected
            && Number(app?.pid || 0) > 1
            && Number.isInteger(Number(app?.pm2_env?.restart_time));
          console.log(`PM2_APP_COUNT=${rows.length}`);
          console.log(`PM2_APP_STATUS=${app?.pm2_env?.status === 'online' ? 'online' : 'not_online'}`);
          console.log(`PM2_APP_CWD=${String(app?.pm2_env?.pm_cwd || '') === expected ? 'expected_release' : 'other'}`);
          console.log(`PM2_APP_RESTART_COUNT_VALID=${Number.isInteger(Number(app?.pm2_env?.restart_time)) ? 'yes' : 'no'}`);
          if (!valid) process.exit(1);
          NODE
          rm -f "$snapshot"
          pm2 save >/dev/null
          test -s /home/ubuntu/.pm2/dump.pm2

          if systemctl list-timers --all --no-legend 'fanmind-controlled-reboot-*.timer' | grep -q 'fanmind-controlled-reboot-'; then
            echo 'EXISTING_CONTROLLED_REBOOT_TIMER=present' | tee -a "$report"
            exit 1
          fi

          boot_hash="$(sha256sum /proc/sys/kernel/random/boot_id | awk '{print $1}')"
          test "${#boot_hash}" = 64
          echo "boot_hash=$boot_hash" >> "$GITHUB_OUTPUT"
          echo 'RELEASE_AND_PUBLIC_HEALTH=healthy' | tee -a "$report"
          echo 'NGINX_CONTRACT=healthy' | tee -a "$report"
          echo 'PM2_SYSTEMD_CONTRACT=healthy' | tee -a "$report"
          echo 'SELF_HOSTED_RUNNER_CONTRACT=healthy' | tee -a "$report"
          echo 'REQUIRED_ENABLED_TIMER_COUNT=7' | tee -a "$report"
          echo "PACKAGE_AND_LOAD_IDLE_WAIT_SECONDS=$waited_seconds" | tee -a "$report"
          echo 'PACKAGE_LOCKS=free' | tee -a "$report"
          echo 'DPKG_AUDIT=clean' | tee -a "$report"
          echo 'HOST_CAPACITY=healthy' | tee -a "$report"
          echo 'REBOOT_REQUIRED_BEFORE=yes' | tee -a "$report"
          echo 'PRE_REBOOT_BOOT_ID_RECORDED=hashed' | tee -a "$report"

      - name: Create and verify a fresh encrypted server-configuration backup
        shell: bash
        run: |
          set -euo pipefail
          report="$GITHUB_WORKSPACE/$REPORT_PATH"
          sudo -n env GITHUB_RUN_ID="$GITHUB_RUN_ID" /usr/bin/node --input-type=module <<'NODE' | tee -a "$report"
          import { createHash } from 'node:crypto';
          import { createReadStream } from 'node:fs';
          import { readFile, realpath, stat } from 'node:fs/promises';
          import { basename, relative } from 'node:path';

          function parseEnv(source) {
            const values = {};
            for (const rawLine of String(source).split(/\r?\n/u)) {
              const line = rawLine.trim();
              if (!line || line.startsWith('#') || !line.includes('=')) continue;
              const separator = line.indexOf('=');
              const key = line.slice(0, separator).trim();
              let value = line.slice(separator + 1).trim();
              if (value.length >= 2 && ((value.startsWith('"') && value.endsWith('"')) || (value.startsWith("'") && value.endsWith("'")))) value = value.slice(1, -1);
              values[key] = value;
            }
            return values;
          }
          const sleep = ms => new Promise(resolvePromise => setTimeout(resolvePromise, ms));
          const env = parseEnv(await readFile('/etc/fanmind-backup/worker.env', 'utf8'));
          const url = String(env.NEXT_PUBLIC_SUPABASE_URL || '').replace(/\/$/u, '');
          const key = String(env.SUPABASE_SERVICE_ROLE_KEY || '');
          if (!/^https:\/\/[^/]+\.supabase\.co$/u.test(url) || key.length < 20) throw new Error('backup_config_invalid');
          const headers = (prefer = '') => ({
            apikey: key,
            Authorization: `Bearer ${key}`,
            'Content-Type': 'application/json',
            ...(prefer ? { Prefer: prefer } : {}),
          });
          async function api(path, init = {}) {
            const response = await fetch(`${url}/rest/v1/${path}`, { ...init, headers: { ...headers(), ...(init.headers || {}) }, signal: AbortSignal.timeout(20000) });
            const payload = await response.json().catch(() => null);
            if (!response.ok) throw new Error('backup_api_failed');
            return payload;
          }
          async function checksum(path) {
            const hash = createHash('sha256');
            await new Promise((resolvePromise, reject) => createReadStream(path).on('data', chunk => hash.update(chunk)).on('error', reject).on('end', resolvePromise));
            return hash.digest('hex');
          }
          async function validateRun(row, expectedType, maximumAgeHours) {
            if (!row || row.backup_type !== expectedType || row.validation_status !== 'passed') throw new Error('backup_run_invalid');
            const finished = Date.parse(String(row.finished_at || row.started_at || ''));
            const ageHours = (Date.now() - finished) / 3600000;
            if (!Number.isFinite(ageHours) || ageHours < 0 || ageHours > maximumAgeHours) throw new Error('backup_age_invalid');
            const root = await realpath(env.FANMIND_BACKUP_ROOT || '/var/backups/fanmind');
            const artifact = await realpath(String(row.storage_reference || ''));
            const checksumPath = await realpath(String(row.checksum_reference || ''));
            if (relative(root, artifact).startsWith('..') || relative(root, checksumPath).startsWith('..') || checksumPath !== `${artifact}.sha256`) throw new Error('backup_path_invalid');
            const expectedLine = (await readFile(checksumPath, 'utf8')).trim();
            const match = expectedLine.match(/^([0-9a-f]{64})\s+\*?(.+)$/iu);
            const metadata = await stat(artifact);
            const actual = await checksum(artifact);
            if (!match || basename(match[2]) !== basename(artifact) || actual !== match[1].toLowerCase() || actual !== row.sha256 || metadata.size !== Number(row.size_bytes)) throw new Error('backup_checksum_invalid');
            const offsiteEnabled = env.FANMIND_BACKUP_OFFSITE_ENABLED === 'true';
            if (offsiteEnabled && (row.offsite_status !== 'uploaded' || row.status !== 'succeeded')) throw new Error('backup_offsite_invalid');
            return { ageHours, sizeBytes: metadata.size, offsite: offsiteEnabled ? 'uploaded' : 'not_required' };
          }

          const activeJobs = await api('admin_operation_jobs?select=id&status=in.(queued,running)&job_type=in.(backup_server_config,backup_database,backup_storage,backup_full)&limit=10');
          if (!Array.isArray(activeJobs) || activeJobs.length !== 0) throw new Error('backup_jobs_busy');

          const latestFullRows = await api('backup_runs?select=backup_type,status,validation_status,offsite_status,storage_reference,checksum_reference,sha256,size_bytes,started_at,finished_at&backup_type=eq.full&validation_status=eq.passed&order=finished_at.desc&limit=1');
          const full = await validateRun(Array.isArray(latestFullRows) ? latestFullRows[0] : null, 'full', 168);
          console.log(`LATEST_FULL_BACKUP_AGE_HOURS=${Math.ceil(full.ageHours)}`);
          console.log(`LATEST_FULL_BACKUP_SIZE_BYTES=${full.sizeBytes}`);
          console.log(`LATEST_FULL_BACKUP_OFFSITE=${full.offsite}`);
          console.log('LATEST_FULL_BACKUP_CHECKSUM=ok');

          const created = await api('admin_operation_jobs', {
            method: 'POST',
            headers: headers('return=representation'),
            body: JSON.stringify({
              job_type: 'backup_server_config',
              status: 'queued',
              severity: 'info',
              requested_at: new Date().toISOString(),
              title: 'Controlled reboot final preflight configuration backup',
              summary: 'Fresh encrypted server configuration backup before one controlled reboot.',
              idempotency_key: `controlled-reboot-final:${process.env.GITHUB_RUN_ID}:server-config`,
              priority: 1,
              metadata: { source: 'controlled_reboot_final_preflight' },
            }),
          });
          const job = Array.isArray(created) ? created[0] : null;
          if (!job?.id) throw new Error('backup_enqueue_failed');
          console.log('FRESH_SERVER_CONFIG_BACKUP_ENQUEUED=yes');

          let resultReference = null;
          for (let attempt = 1; attempt <= 180; attempt += 1) {
            const rows = await api(`admin_operation_jobs?select=status,result_reference&id=eq.${encodeURIComponent(job.id)}&limit=1`);
            const current = Array.isArray(rows) ? rows[0] : null;
            if (current?.status === 'failed' || current?.status === 'cancelled') throw new Error('backup_job_failed');
            if (current?.status === 'succeeded' && current?.result_reference) {
              resultReference = current.result_reference;
              break;
            }
            await sleep(5000);
          }
          if (!resultReference) throw new Error('backup_job_timeout');
          const runRows = await api(`backup_runs?select=backup_type,status,validation_status,offsite_status,storage_reference,checksum_reference,sha256,size_bytes,started_at,finished_at&id=eq.${encodeURIComponent(resultReference)}&limit=1`);
          const fresh = await validateRun(Array.isArray(runRows) ? runRows[0] : null, 'server_config', 1);
          console.log(`FRESH_SERVER_CONFIG_BACKUP_SIZE_BYTES=${fresh.sizeBytes}`);
          console.log(`FRESH_SERVER_CONFIG_BACKUP_OFFSITE=${fresh.offsite}`);
          console.log('FRESH_SERVER_CONFIG_BACKUP_CHECKSUM=ok');
          console.log('BACKUP_IDENTIFIERS_OR_PATHS_PRINTED=false');
          console.log('REBOOT_BACKUP_PREFLIGHT_RESULT=success');
          NODE

      - name: Schedule exactly one delayed root-owned reboot
        shell: bash
        run: |
          set -euo pipefail
          report="$GITHUB_WORKSPACE/$REPORT_PATH"
          unit="fanmind-controlled-reboot-final-${GITHUB_RUN_ID}"
          sudo -n systemd-run \
            --unit="$unit" \
            --description="One controlled FanMind Ubuntu reboot after verified final preflight" \
            --on-active=180s \
            --property=Type=oneshot \
            /usr/bin/systemctl reboot >/dev/null
          systemctl list-timers --all --no-legend "${unit}.timer" | grep -q "${unit}.timer"
          echo 'CONTROLLED_REBOOT_SCHEDULED=yes' | tee -a "$report"
          echo 'CONTROLLED_REBOOT_DELAY_SECONDS=180' | tee -a "$report"
          echo 'SECOND_REBOOT_AUTOMATION=absent' | tee -a "$report"
          echo 'REBOOT_PREFLIGHT_RESULT=success' | tee -a "$report"

      - name: Upload sanitized final pre-reboot evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fanmind-controlled-reboot-final-preflight
          path: fanmind-controlled-reboot-final-preflight.txt
          if-no-files-found: error
          retention-days: 14

  watch-recovery:
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      EXPECTED_RELEASE: 6b8ba61a1786651713b2507340dc7b673811159d
      REPORT_PATH: fanmind-controlled-reboot-final-recovery-watch.txt
    steps:
      - name: Observe one public outage and recovery
        shell: bash
        run: |
          set -euo pipefail
          report="$GITHUB_WORKSPACE/$REPORT_PATH"
          : > "$report"
          printf 'RECOVERY_WATCH_UTC=%s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" | tee -a "$report"
          curl -fsSL --max-time 10 https://fanmind.ch/api/health -o /dev/null
          echo 'PUBLIC_HEALTH_BEFORE_OUTAGE=healthy' | tee -a "$report"

          outage=no
          recovery=no
          for attempt in $(seq 1 240); do
            if curl -fsSL --max-time 8 https://fanmind.ch/api/health -o /dev/null 2>/dev/null; then
              if [ "$outage" = yes ]; then
                recovery=yes
                break
              fi
            else
              outage=yes
            fi
            sleep 5
          done
          test "$outage" = yes
          test "$recovery" = yes
          test "$(curl -fsSL --max-time 15 https://fanmind.ch/api/version | node -e '
            let input="";
            process.stdin.on("data", chunk => input += chunk);
            process.stdin.on("end", () => process.stdout.write(JSON.parse(input).releaseCommit || "missing"));
          ')" = "$EXPECTED_RELEASE"
          echo 'PUBLIC_OUTAGE_OBSERVED=yes' | tee -a "$report"
          echo 'PUBLIC_RECOVERY_OBSERVED=yes' | tee -a "$report"
          echo 'PUBLIC_RELEASE_AFTER_RECOVERY=expected' | tee -a "$report"
          echo 'RECOVERY_WATCH_RESULT=success' | tee -a "$report"

      - name: Upload sanitized external recovery evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fanmind-controlled-reboot-final-recovery-watch
          path: fanmind-controlled-reboot-final-recovery-watch.txt
          if-no-files-found: error
          retention-days: 14

  post-reboot:
    needs:
      - preflight
      - watch-recovery
    runs-on:
      - self-hosted
      - fanmind-prod
      - exoscale
      - linux
      - x64
    timeout-minutes: 25
    env:
      EXPECTED_RELEASE: 6b8ba61a1786651713b2507340dc7b673811159d
      PRE_BOOT_HASH: ${{ needs.preflight.outputs.boot_hash }}
      REPORT_PATH: fanmind-controlled-reboot-final-postcheck.txt
    steps:
      - name: Verify new boot, services, timers and exact release
        shell: bash
        run: |
          set -euo pipefail
          report="$GITHUB_WORKSPACE/$REPORT_PATH"
          : > "$report"
          printf 'POST_REBOOT_UTC=%s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" | tee -a "$report"
          printf 'EXPECTED_RELEASE=%s\n' "$EXPECTED_RELEASE" | tee -a "$report"

          current_boot_hash="$(sha256sum /proc/sys/kernel/random/boot_id | awk '{print $1}')"
          test "${#PRE_BOOT_HASH}" = 64
          test "${#current_boot_hash}" = 64
          test "$current_boot_hash" != "$PRE_BOOT_HASH"

          systemctl is-active --quiet actions.runner.Bernds-tech-FanMind.fanmind-prod-01-exoscale.service
          test "$(systemctl is-enabled actions.runner.Bernds-tech-FanMind.fanmind-prod-01-exoscale.service)" = enabled
          sudo -n nginx -t >/dev/null 2>&1
          systemctl is-active --quiet nginx.service
          systemctl is-active --quiet pm2-ubuntu.service
          test "$(systemctl is-enabled pm2-ubuntu.service)" = enabled
          main_pid="$(systemctl show pm2-ubuntu.service -p MainPID --value)"
          test "$main_pid" -gt 1
          test -s /home/ubuntu/.pm2/pm2.pid
          test "$(tr -d '[:space:]' < /home/ubuntu/.pm2/pm2.pid)" = "$main_pid"
          systemctl is-active --quiet fanmind-backup-worker.service

          timers=(
            fanmind-backup-database.timer
            fanmind-backup-storage.timer
            fanmind-backup-server_config.timer
            fanmind-backup-full.timer
            fanmind-backup-retention.timer
            fanmind-demo-cleanup.timer
            fanmind-webhook-retention.timer
          )
          for timer in "${timers[@]}"; do
            systemctl is-active --quiet "$timer"
            test "$(systemctl is-enabled "$timer")" = enabled
          done

          test "$(git -C /var/www/fanmind rev-parse HEAD)" = "$EXPECTED_RELEASE"
          test "$(git -C /var/www/fanmind rev-parse origin/main)" = "$EXPECTED_RELEASE"
          test "$(readlink -f /var/www/fanmind-current)" = "/var/www/fanmind-releases/$EXPECTED_RELEASE"
          test ! -f /run/reboot-required

          capture_app() {
            local output="$1"
            local state="$2"
            umask 077
            pm2 jlist > "$output"
            SNAPSHOT="$output" STATE="$state" EXPECTED_RELEASE="$EXPECTED_RELEASE" node --input-type=module <<'NODE' | tee -a "$report"
            import fs from 'node:fs';
            const rows = JSON.parse(fs.readFileSync(process.env.SNAPSHOT, 'utf8')).filter(item => item?.name === 'fanmind');
            const app = rows.length === 1 ? rows[0] : null;
            const expected = `/var/www/fanmind-releases/${process.env.EXPECTED_RELEASE}`;
            const value = {
              pid: Number(app?.pid || 0),
              restarts: Number(app?.pm2_env?.restart_time),
              online: app?.pm2_env?.status === 'online',
              cwd: String(app?.pm2_env?.pm_cwd || '') === expected,
            };
            console.log(`PM2_POST_APP_COUNT=${rows.length}`);
            console.log(`PM2_POST_APP_STATUS=${value.online ? 'online' : 'not_online'}`);
            console.log(`PM2_POST_APP_CWD=${value.cwd ? 'expected_release' : 'other'}`);
            console.log(`PM2_POST_APP_RESTART_COUNT_VALID=${Number.isInteger(value.restarts) && value.restarts >= 0 ? 'yes' : 'no'}`);
            if (rows.length !== 1 || value.pid < 2 || !value.online || !value.cwd || !Number.isInteger(value.restarts) || value.restarts < 0) process.exit(1);
            fs.writeFileSync(process.env.STATE, JSON.stringify(value), { mode: 0o600, flag: 'wx' });
            NODE
            rm -f "$output"
          }

          capture_app "$RUNNER_TEMP/fanmind-post-reboot-final-app-1.json" "$RUNNER_TEMP/fanmind-post-reboot-final-state-1.json"
          for attempt in $(seq 1 90); do
            if curl -fsSL --max-time 10 https://fanmind.ch/api/health -o /dev/null 2>/dev/null; then break; fi
            sleep 2
          done
          test "$(curl -fsSL --max-time 15 https://fanmind.ch/api/version | node -e '
            let input="";
            process.stdin.on("data", chunk => input += chunk);
            process.stdin.on("end", () => process.stdout.write(JSON.parse(input).releaseCommit || "missing"));
          ')" = "$EXPECTED_RELEASE"
          curl -fsSL --max-time 15 https://fanmind.ch/api/health | node -e '
            let input="";
            process.stdin.on("data", chunk => input += chunk);
            process.stdin.on("end", () => {
              const payload = JSON.parse(input);
              const checks = Array.isArray(payload.checks) ? payload.checks : [];
              process.exit(payload.status === "healthy" && checks.length >= 7 && checks.every(item => item?.status === "healthy") ? 0 : 1);
            });
          '
          for route in / /login /register /forgot-password /account-deletion /datenschutz /roadmap /api/version /api/health; do
            curl -fsSL --max-time 15 "https://fanmind.ch${route}" -o /dev/null
          done

          sleep 60
          capture_app "$RUNNER_TEMP/fanmind-post-reboot-final-app-2.json" "$RUNNER_TEMP/fanmind-post-reboot-final-state-2.json"
          BEFORE="$RUNNER_TEMP/fanmind-post-reboot-final-state-1.json" AFTER="$RUNNER_TEMP/fanmind-post-reboot-final-state-2.json" node --input-type=module <<'NODE' | tee -a "$report"
          import fs from 'node:fs';
          const before = JSON.parse(fs.readFileSync(process.env.BEFORE, 'utf8'));
          const after = JSON.parse(fs.readFileSync(process.env.AFTER, 'utf8'));
          const stable = before.pid === after.pid && before.restarts === after.restarts && after.online && after.cwd;
          console.log(`PM2_POST_REBOOT_STABLE_60_SECONDS=${stable ? 'yes' : 'no'}`);
          if (!stable) process.exit(1);
          NODE
          rm -f "$RUNNER_TEMP/fanmind-post-reboot-final-state-1.json" "$RUNNER_TEMP/fanmind-post-reboot-final-state-2.json"

          if systemctl list-timers --all --no-legend 'fanmind-controlled-reboot-final-*.timer' | grep -q 'fanmind-controlled-reboot-final-'; then
            echo 'CONTROLLED_REBOOT_TIMER_AFTER=unexpected' | tee -a "$report"
            exit 1
          fi

          echo 'BOOT_ID_CHANGED=yes' | tee -a "$report"
          echo 'SELF_HOSTED_RUNNER_AFTER_REBOOT=active' | tee -a "$report"
          echo 'NGINX_AFTER_REBOOT=healthy' | tee -a "$report"
          echo 'PM2_SYSTEMD_AFTER_REBOOT=healthy' | tee -a "$report"
          echo 'BACKUP_WORKER_AND_REQUIRED_TIMERS_AFTER_REBOOT=healthy' | tee -a "$report"
          echo 'REBOOT_REQUIRED_AFTER=no' | tee -a "$report"
          echo 'PUBLIC_RELEASE_AND_HEALTH_AFTER_REBOOT=healthy' | tee -a "$report"
          echo 'PUBLIC_CORE_ROUTES_AFTER_REBOOT=healthy' | tee -a "$report"
          echo 'CUSTOMER_BILLING_CRM_OR_DATABASE_MUTATION=none' | tee -a "$report"
          echo 'CONTROLLED_REBOOT_FINAL_RESULT=success' | tee -a "$report"

      - name: Upload sanitized final post-reboot evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fanmind-controlled-reboot-final-postcheck
          path: fanmind-controlled-reboot-final-postcheck.txt
          if-no-files-found: error
          retention-days: 14
