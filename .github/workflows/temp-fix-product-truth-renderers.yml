name: Temporary Product Truth Renderer Fix

on:
  push:
    branches:
      - p1/product-truth-followups-whatsapp-20260725
    paths:
      - .github/workflows/temp-fix-product-truth-renderers.yml

permissions:
  contents: write

jobs:
  fix-renderer-types:
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Checkout target branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: p1/product-truth-followups-whatsapp-20260725
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v4
        with:
          node-version: 24
          cache: npm

      - name: Apply type-safe optional marker guards
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("src/app/landing-v2/page.tsx")
          text = path.read_text(encoding="utf-8")

          old_function = '            const showComingSoonMark = card.showComingSoonMark || isComingSoonStatus(card.status);'
          new_function = '''            const showComingSoonMark =
              isComingSoonStatus(card.status) ||
              ("showComingSoonMark" in card && card.showComingSoonMark === true);'''
          if text.count(old_function) != 1:
              raise SystemExit(f"function-card marker expression count={text.count(old_function)}")
          text = text.replace(old_function, new_function, 1)

          old_step = 'step.showComingSoonMark || isComingSoonStatus(step.badge)'
          new_step = '("showComingSoonMark" in step && step.showComingSoonMark === true) || isComingSoonStatus(step.badge)'
          if text.count(old_step) != 2:
              raise SystemExit(f"six-step marker expression count={text.count(old_step)}")
          text = text.replace(old_step, new_step)

          old_badge = 'step.badge && !step.showComingSoonMark && ('
          new_badge = 'step.badge && !("showComingSoonMark" in step && step.showComingSoonMark === true) && ('
          if text.count(old_badge) != 1:
              raise SystemExit(f"six-step badge guard count={text.count(old_badge)}")
          text = text.replace(old_badge, new_badge, 1)

          path.write_text(text, encoding="utf-8")
          PY
          npm ci --no-audit --no-fund
          node --test tests/public-product-copy.test.mjs
          npm run build
          git diff --check

      - name: Commit page correction only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Bernds-tech"
          git config user.email "270165082+Bernds-tech@users.noreply.github.com"
          git add src/app/landing-v2/page.tsx
          git commit -m "Keep optional landing markers type-safe"
          git push origin HEAD:p1/product-truth-followups-whatsapp-20260725
