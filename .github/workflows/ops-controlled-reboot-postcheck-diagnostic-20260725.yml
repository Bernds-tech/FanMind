name: FanMind P1 Controlled Reboot Postcheck Diagnostic

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
    paths:
      - ".github/workflows/ops-controlled-reboot-postcheck-diagnostic-20260725.yml"

concurrency:
  group: fanmind-p1-controlled-reboot-postcheck-diagnostic-20260725
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  diagnose:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'ops/controlled-ubuntu-reboot-20260724'
    runs-on:
      - self-hosted
      - fanmind-prod
      - exoscale
      - linux
      - x64
    timeout-minutes: 20
    env:
      EXPECTED_RELEASE: 6b8ba61a1786651713b2507340dc7b673811159d
      REPORT_PATH: fanmind-controlled-reboot-postcheck-diagnostic.txt
    steps:
      - name: Record every post-reboot contract without mutation
        shell: bash
        run: |
          set -uo pipefail
          report="$GITHUB_WORKSPACE/$REPORT_PATH"
          : > "$report"
          failures=0

          record() {
            printf '%s=%s\n' "$1" "$2" | tee -a "$report"
          }

          check() {
            local key="$1"
            shift
            if "$@" >/dev/null 2>&1; then
              record "$key" pass
            else
              record "$key" fail
              failures=$((failures + 1))
            fi
          }

          record POSTCHECK_UTC "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          record EXPECTED_RELEASE "$EXPECTED_RELEASE"
          uptime_seconds="$(awk '{printf "%d", $1}' /proc/uptime 2>/dev/null || printf 0)"
          record HOST_UPTIME_SECONDS "$uptime_seconds"
          boot_started="$(uptime -s 2>/dev/null | tr ' ' 'T' || printf unavailable)"
          record HOST_BOOT_STARTED "$boot_started"
          current_boot_hash="$(sha256sum /proc/sys/kernel/random/boot_id 2>/dev/null | awk '{print $1}')"
          [ "${#current_boot_hash}" -eq 64 ] && record CURRENT_BOOT_ID_HASH_VALID pass || { record CURRENT_BOOT_ID_HASH_VALID fail; failures=$((failures + 1)); }

          live_release="$(curl -fsSL --max-time 15 https://fanmind.ch/api/version 2>/dev/null | node -e '
            let input="";
            process.stdin.on("data", chunk => input += chunk);
            process.stdin.on("end", () => {
              try { process.stdout.write(JSON.parse(input).releaseCommit || "missing"); }
              catch { process.stdout.write("invalid"); }
            });
          ' 2>/dev/null || printf unavailable)"
          [ "$live_release" = "$EXPECTED_RELEASE" ] && record LIVE_RELEASE pass || { record LIVE_RELEASE fail; failures=$((failures + 1)); }
          check SERVER_HEAD test "$(git -C /var/www/fanmind rev-parse HEAD 2>/dev/null || true)" = "$EXPECTED_RELEASE"
          check ORIGIN_MAIN test "$(git -C /var/www/fanmind rev-parse origin/main 2>/dev/null || true)" = "$EXPECTED_RELEASE"
          check CURRENT_RELEASE_LINK test "$(readlink -f /var/www/fanmind-current 2>/dev/null || true)" = "/var/www/fanmind-releases/$EXPECTED_RELEASE"

          if curl -fsSL --max-time 15 https://fanmind.ch/api/health 2>/dev/null | node -e '
            let input="";
            process.stdin.on("data", chunk => input += chunk);
            process.stdin.on("end", () => {
              try {
                const payload = JSON.parse(input);
                const checks = Array.isArray(payload.checks) ? payload.checks : [];
                process.exit(payload.status === "healthy" && checks.length >= 7 && checks.every(item => item?.status === "healthy") ? 0 : 1);
              } catch { process.exit(1); }
            });
          '; then
            record PUBLIC_HEALTH pass
          else
            record PUBLIC_HEALTH fail
            failures=$((failures + 1))
          fi

          check RUNNER_ACTIVE systemctl is-active --quiet actions.runner.Bernds-tech-FanMind.fanmind-prod-01-exoscale.service
          check RUNNER_ENABLED test "$(systemctl is-enabled actions.runner.Bernds-tech-FanMind.fanmind-prod-01-exoscale.service 2>/dev/null || true)" = enabled
          check NGINX_CONFIG sudo -n nginx -t
          check NGINX_ACTIVE systemctl is-active --quiet nginx.service
          check PM2_UNIT_ACTIVE systemctl is-active --quiet pm2-ubuntu.service
          check PM2_UNIT_ENABLED test "$(systemctl is-enabled pm2-ubuntu.service 2>/dev/null || true)" = enabled
          check PM2_UNIT_TYPE test "$(systemctl show pm2-ubuntu.service -p Type --value 2>/dev/null || true)" = forking
          check PM2_UNIT_USER test "$(systemctl show pm2-ubuntu.service -p User --value 2>/dev/null || true)" = ubuntu
          main_pid="$(systemctl show pm2-ubuntu.service -p MainPID --value 2>/dev/null || printf 0)"
          if [[ "$main_pid" =~ ^[0-9]+$ ]] && [ "$main_pid" -gt 1 ]; then record PM2_MAIN_PID pass; else record PM2_MAIN_PID fail; failures=$((failures + 1)); fi
          check PM2_PIDFILE_PRESENT test -s /home/ubuntu/.pm2/pm2.pid
          pidfile_value="$(tr -d '[:space:]' < /home/ubuntu/.pm2/pm2.pid 2>/dev/null || true)"
          [ "$pidfile_value" = "$main_pid" ] && record PM2_PIDFILE_MATCH pass || { record PM2_PIDFILE_MATCH fail; failures=$((failures + 1)); }
          check BACKUP_WORKER_ACTIVE systemctl is-active --quiet fanmind-backup-worker.service

          timers=(
            fanmind-backup-database.timer
            fanmind-backup-storage.timer
            fanmind-backup-server_config.timer
            fanmind-backup-full.timer
            fanmind-backup-retention.timer
            fanmind-demo-cleanup.timer
            fanmind-webhook-retention.timer
          )
          for timer in "${timers[@]}"; do
            key="$(printf '%s' "$timer" | tr '[:lower:].-' '[:upper:]__')"
            check "${key}_ACTIVE" systemctl is-active --quiet "$timer"
            check "${key}_ENABLED" test "$(systemctl is-enabled "$timer" 2>/dev/null || true)" = enabled
          done

          if [ -f /run/reboot-required ]; then
            record REBOOT_REQUIRED_MARKER present
            failures=$((failures + 1))
          else
            record REBOOT_REQUIRED_MARKER absent
          fi

          transient_rows="$(systemctl list-timers --all --no-legend 'fanmind-controlled-reboot-final-*.timer' 2>/dev/null | grep -c 'fanmind-controlled-reboot-final-' || true)"
          record CONTROLLED_REBOOT_TIMER_ROW_COUNT "$transient_rows"

          snapshot="$RUNNER_TEMP/fanmind-post-reboot-diagnostic.json"
          umask 077
          if pm2 jlist > "$snapshot" 2>/dev/null && SNAPSHOT="$snapshot" EXPECTED_RELEASE="$EXPECTED_RELEASE" node --input-type=module <<'NODE' > "$RUNNER_TEMP/fanmind-post-reboot-pm2-summary.txt"
          import fs from 'node:fs';
          const rows = JSON.parse(fs.readFileSync(process.env.SNAPSHOT, 'utf8')).filter(item => item?.name === 'fanmind');
          const app = rows.length === 1 ? rows[0] : null;
          const expected = `/var/www/fanmind-releases/${process.env.EXPECTED_RELEASE}`;
          const valid = rows.length === 1
            && app?.pm2_env?.status === 'online'
            && String(app?.pm2_env?.pm_cwd || '') === expected
            && Number(app?.pid || 0) > 1
            && Number.isInteger(Number(app?.pm2_env?.restart_time));
          console.log(`PM2_APP_COUNT=${rows.length}`);
          console.log(`PM2_APP_STATUS=${app?.pm2_env?.status === 'online' ? 'online' : 'not_online'}`);
          console.log(`PM2_APP_CWD=${String(app?.pm2_env?.pm_cwd || '') === expected ? 'expected_release' : 'other'}`);
          console.log(`PM2_APP_RESTART_COUNT_VALID=${Number.isInteger(Number(app?.pm2_env?.restart_time)) ? 'yes' : 'no'}`);
          process.exit(valid ? 0 : 1);
          NODE
          then
            cat "$RUNNER_TEMP/fanmind-post-reboot-pm2-summary.txt" | tee -a "$report"
            record PM2_APP_CONTRACT pass
          else
            [ -f "$RUNNER_TEMP/fanmind-post-reboot-pm2-summary.txt" ] && cat "$RUNNER_TEMP/fanmind-post-reboot-pm2-summary.txt" | tee -a "$report"
            record PM2_APP_CONTRACT fail
            failures=$((failures + 1))
          fi
          rm -f "$snapshot" "$RUNNER_TEMP/fanmind-post-reboot-pm2-summary.txt"

          route_failures=0
          for route in / /login /register /forgot-password /account-deletion /datenschutz /roadmap /api/version /api/health; do
            if ! curl -fsSL --max-time 15 "https://fanmind.ch${route}" -o /dev/null 2>/dev/null; then route_failures=$((route_failures + 1)); fi
          done
          record PUBLIC_ROUTE_FAILURE_COUNT "$route_failures"
          if [ "$route_failures" -eq 0 ]; then record PUBLIC_CORE_ROUTES pass; else record PUBLIC_CORE_ROUTES fail; failures=$((failures + 1)); fi

          command -v fuser >/dev/null 2>&1 || { record FUSER_AVAILABLE fail; failures=$((failures + 1)); }
          package_locks=(/var/lib/dpkg/lock-frontend /var/lib/dpkg/lock /var/lib/apt/lists/lock /var/cache/apt/archives/lock)
          held_locks=0
          for lock in "${package_locks[@]}"; do
            if sudo -n fuser "$lock" >/dev/null 2>&1; then held_locks=$((held_locks + 1)); fi
          done
          record PACKAGE_HELD_LOCK_COUNT "$held_locks"
          [ "$held_locks" -eq 0 ] && record PACKAGE_LOCKS pass || { record PACKAGE_LOCKS fail; failures=$((failures + 1)); }
          dpkg_audit_lines="$(sudo -n dpkg --audit 2>/dev/null | sed '/^[[:space:]]*$/d' | wc -l)"
          record DPKG_AUDIT_LINE_COUNT "$dpkg_audit_lines"
          [ "$dpkg_audit_lines" -eq 0 ] && record DPKG_AUDIT pass || { record DPKG_AUDIT fail; failures=$((failures + 1)); }

          sleep 60
          snapshot="$RUNNER_TEMP/fanmind-post-reboot-diagnostic-stability.json"
          if pm2 jlist > "$snapshot" 2>/dev/null && SNAPSHOT="$snapshot" EXPECTED_RELEASE="$EXPECTED_RELEASE" node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const rows = JSON.parse(fs.readFileSync(process.env.SNAPSHOT, 'utf8')).filter(item => item?.name === 'fanmind');
          const app = rows.length === 1 ? rows[0] : null;
          const expected = `/var/www/fanmind-releases/${process.env.EXPECTED_RELEASE}`;
          process.exit(rows.length === 1 && app?.pm2_env?.status === 'online' && String(app?.pm2_env?.pm_cwd || '') === expected && Number(app?.pid || 0) > 1 ? 0 : 1);
          NODE
          then
            record PM2_STABLE_AFTER_60_SECONDS pass
          else
            record PM2_STABLE_AFTER_60_SECONDS fail
            failures=$((failures + 1))
          fi
          rm -f "$snapshot"

          record FAILURE_COUNT "$failures"
          if [ "$failures" -eq 0 ]; then record CONTROLLED_REBOOT_POSTCHECK_DIAGNOSTIC success; else record CONTROLLED_REBOOT_POSTCHECK_DIAGNOSTIC failed; fi
          exit "$([ "$failures" -eq 0 ] && printf 0 || printf 1)"

      - name: Upload sanitized post-reboot diagnostic
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fanmind-controlled-reboot-postcheck-diagnostic
          path: fanmind-controlled-reboot-postcheck-diagnostic.txt
          if-no-files-found: error
          retention-days: 14
