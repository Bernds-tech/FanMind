name: FanMind P1 Controlled PM2 systemd Handoff

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
    paths:
      - ".github/workflows/ops-controlled-pm2-systemd-handoff-20260724.yml"

concurrency:
  group: fanmind-p1-controlled-pm2-systemd-handoff-20260724
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  handoff:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'ops/controlled-ubuntu-reboot-20260724'
    runs-on:
      - self-hosted
      - fanmind-prod
      - exoscale
      - linux
      - x64
    timeout-minutes: 20
    env:
      EXPECTED_RELEASE: 6b8ba61a1786651713b2507340dc7b673811159d
      REPORT_PATH: fanmind-pm2-systemd-handoff.txt

    steps:
      - name: Checkout trusted reboot branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ops/controlled-ubuntu-reboot-20260724
          fetch-depth: 1
          show-progress: false

      - name: Verify exact release and handoff prerequisites
        shell: bash
        run: |
          set -euo pipefail
          report="$GITHUB_WORKSPACE/$REPORT_PATH"
          : > "$report"
          printf 'PM2_HANDOFF_UTC=%s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" | tee -a "$report"
          printf 'EXPECTED_RELEASE=%s\n' "$EXPECTED_RELEASE" | tee -a "$report"

          live_release="$(curl -fsSL --max-time 15 https://fanmind.ch/api/version | node -e '
            let input="";
            process.stdin.on("data", chunk => input += chunk);
            process.stdin.on("end", () => process.stdout.write(JSON.parse(input).releaseCommit || "missing"));
          ')"
          test "$live_release" = "$EXPECTED_RELEASE"
          test "$(git -C /var/www/fanmind rev-parse HEAD)" = "$EXPECTED_RELEASE"
          test "$(git -C /var/www/fanmind rev-parse origin/main)" = "$EXPECTED_RELEASE"
          test "$(readlink -f /var/www/fanmind-current)" = "/var/www/fanmind-releases/$EXPECTED_RELEASE"

          curl -fsSL --max-time 15 https://fanmind.ch/api/health | node -e '
            let input="";
            process.stdin.on("data", chunk => input += chunk);
            process.stdin.on("end", () => {
              const payload = JSON.parse(input);
              const checks = Array.isArray(payload.checks) ? payload.checks : [];
              process.exit(
                payload.status === "healthy" &&
                checks.length >= 7 &&
                checks.every(item => item?.status === "healthy")
                  ? 0
                  : 1,
              );
            });
          '

          test "$(systemctl is-enabled pm2-ubuntu.service)" = enabled
          test "$(systemctl show pm2-ubuntu.service -p Type --value)" = forking
          test "$(systemctl show pm2-ubuntu.service -p User --value)" = ubuntu
          test "$(systemctl show pm2-ubuntu.service -p PIDFile --value)" = /home/ubuntu/.pm2/pm2.pid
          [[ "$(systemctl show pm2-ubuntu.service -p ExecStart --value)" == *resurrect* ]]
          systemctl is-active --quiet actions.runner.Bernds-tech-FanMind.fanmind-prod-01-exoscale.service

          if pgrep -x apt >/dev/null || pgrep -x apt-get >/dev/null || pgrep -x dpkg >/dev/null; then
            echo 'PACKAGE_MANAGER_ACTIVITY=present' | tee -a "$report"
            exit 1
          fi

          pm2 jlist > "$RUNNER_TEMP/fanmind-pm2-before-handoff.json"
          SNAPSHOT="$RUNNER_TEMP/fanmind-pm2-before-handoff.json" EXPECTED_RELEASE="$EXPECTED_RELEASE" node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const rows = JSON.parse(fs.readFileSync(process.env.SNAPSHOT, 'utf8'))
            .filter(item => item?.name === 'fanmind');
          if (rows.length !== 1) throw new Error('fanmind_process_count_invalid');
          const app = rows[0];
          if (
            app?.pm2_env?.status !== 'online' ||
            String(app?.pm2_env?.pm_cwd || '') !== `/var/www/fanmind-releases/${process.env.EXPECTED_RELEASE}` ||
            Number(app.pid || 0) < 2
          ) {
            throw new Error('fanmind_process_state_invalid');
          }
          NODE
          rm -f "$RUNNER_TEMP/fanmind-pm2-before-handoff.json"

          pm2 save >/dev/null
          test -s /home/ubuntu/.pm2/dump.pm2
          echo 'RELEASE_AND_HEALTH_PRE_HANDOFF=healthy' | tee -a "$report"
          echo 'PM2_DUMP_SAVED=yes' | tee -a "$report"
          echo 'PM2_SYSTEMD_CONTRACT=valid' | tee -a "$report"
          echo 'SELF_HOSTED_RUNNER=active' | tee -a "$report"
          echo 'PACKAGE_MANAGER_ACTIVITY=absent' | tee -a "$report"

      - name: Hand the saved PM2 process list to systemd
        shell: bash
        run: |
          set -euo pipefail
          report="$GITHUB_WORKSPACE/$REPORT_PATH"

          sudo -n systemctl stop pm2-ubuntu.service >/dev/null 2>&1 || true
          pm2 kill >/dev/null

          for attempt in $(seq 1 30); do
            if ! pgrep -u ubuntu -f 'PM2.*God Daemon.*\/home\/ubuntu\/\.pm2' >/dev/null; then
              break
            fi
            sleep 1
          done
          if pgrep -u ubuntu -f 'PM2.*God Daemon.*\/home\/ubuntu\/\.pm2' >/dev/null; then
            echo 'PM2_OLD_DAEMON_STOP=failed' | tee -a "$report"
            exit 1
          fi

          sudo -n rm -f /home/ubuntu/.pm2/pm2.pid
          sudo -n systemctl reset-failed pm2-ubuntu.service
          sudo -n systemctl start pm2-ubuntu.service

          for attempt in $(seq 1 60); do
            if systemctl is-active --quiet pm2-ubuntu.service; then
              break
            fi
            sleep 1
          done
          systemctl is-active --quiet pm2-ubuntu.service

          main_pid="$(systemctl show pm2-ubuntu.service -p MainPID --value)"
          test "$main_pid" -gt 1
          test -s /home/ubuntu/.pm2/pm2.pid
          test "$(tr -d '[:space:]' < /home/ubuntu/.pm2/pm2.pid)" = "$main_pid"
          test -d "/proc/$main_pid"
          test "$(stat -c %U "/proc/$main_pid")" = ubuntu

          echo 'PM2_OLD_DAEMON_STOP=complete' | tee -a "$report"
          echo 'PM2_SYSTEMD_SERVICE=active' | tee -a "$report"
          echo 'PM2_SYSTEMD_MAIN_PID_MATCH=yes' | tee -a "$report"

      - name: Verify resurrected FanMind app and public recovery
        shell: bash
        run: |
          set -euo pipefail
          report="$GITHUB_WORKSPACE/$REPORT_PATH"

          verify_app() {
            local snapshot="$1"
            pm2 jlist > "$snapshot"
            SNAPSHOT="$snapshot" EXPECTED_RELEASE="$EXPECTED_RELEASE" node --input-type=module <<'NODE'
            import fs from 'node:fs';
            const rows = JSON.parse(fs.readFileSync(process.env.SNAPSHOT, 'utf8'))
              .filter(item => item?.name === 'fanmind');
            if (rows.length !== 1) throw new Error('fanmind_process_count_invalid');
            const app = rows[0];
            if (
              app?.pm2_env?.status !== 'online' ||
              String(app?.pm2_env?.pm_cwd || '') !== `/var/www/fanmind-releases/${process.env.EXPECTED_RELEASE}` ||
              Number(app.pid || 0) < 2 ||
              !Number.isInteger(Number(app?.pm2_env?.restart_time))
            ) {
              throw new Error('fanmind_process_state_invalid');
            }
            NODE
            rm -f "$snapshot"
          }

          for attempt in $(seq 1 60); do
            if curl -fsSL --max-time 10 https://fanmind.ch/api/health -o /dev/null 2>/dev/null; then
              break
            fi
            sleep 2
          done

          verify_app "$RUNNER_TEMP/fanmind-pm2-after-handoff-1.json"
          test "$(curl -fsSL --max-time 15 https://fanmind.ch/api/version | node -e '
            let input="";
            process.stdin.on("data", chunk => input += chunk);
            process.stdin.on("end", () => process.stdout.write(JSON.parse(input).releaseCommit || "missing"));
          ')" = "$EXPECTED_RELEASE"
          curl -fsSL --max-time 15 https://fanmind.ch/api/health | node -e '
            let input="";
            process.stdin.on("data", chunk => input += chunk);
            process.stdin.on("end", () => {
              const payload = JSON.parse(input);
              const checks = Array.isArray(payload.checks) ? payload.checks : [];
              process.exit(
                payload.status === "healthy" &&
                checks.length >= 7 &&
                checks.every(item => item?.status === "healthy")
                  ? 0
                  : 1,
              );
            });
          '
          for route in / /login /register /forgot-password /datenschutz /roadmap; do
            curl -fsSL --max-time 15 "https://fanmind.ch${route}" -o /dev/null
          done

          sleep 60
          systemctl is-active --quiet pm2-ubuntu.service
          verify_app "$RUNNER_TEMP/fanmind-pm2-after-handoff-2.json"
          curl -fsSL --max-time 15 https://fanmind.ch/api/health -o /dev/null
          pm2 save >/dev/null

          echo 'PM2_APP_RESURRECTED=healthy' | tee -a "$report"
          echo 'PM2_RELEASE_CWD=correct' | tee -a "$report"
          echo 'PM2_SYSTEMD_STABLE_60_SECONDS=yes' | tee -a "$report"
          echo 'PUBLIC_CORE_ROUTES_AFTER_HANDOFF=healthy' | tee -a "$report"
          echo 'DATABASE_OR_CUSTOMER_MUTATION=none' | tee -a "$report"
          echo 'PM2_SYSTEMD_HANDOFF_RESULT=success' | tee -a "$report"

      - name: Upload sanitized PM2 handoff evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fanmind-pm2-systemd-handoff
          path: fanmind-pm2-systemd-handoff.txt
          if-no-files-found: error
          retention-days: 14
