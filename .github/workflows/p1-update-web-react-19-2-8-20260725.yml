name: FanMind P1 Update Web React 19.2.8

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
    paths:
      - ".github/workflows/p1-update-web-react-19-2-8-20260725.yml"

concurrency:
  group: fanmind-p1-update-web-react-19-2-8-20260725
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  patch:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'deps/web-react-19-2-8-20260725' &&
      github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
      NEXT_PUBLIC_APP_URL: https://fanmind.ch
      NEXT_PUBLIC_SITE_URL: https://fanmind.ch
      FANMIND_PUBLIC_DEMO_ENABLED: "false"
      FANMIND_ENABLE_REFERRAL_BILLING: "false"
      FANMIND_ENABLE_TELEGRAM_SEND: "false"
      FANMIND_ADMIN_EMAILS: admin@example.com
    steps:
      - name: Checkout trusted dependency branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: deps/web-react-19-2-8-20260725
          fetch-depth: 1
          show-progress: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install current dependencies reproducibly
        run: npm ci --no-audit --no-fund

      - name: Update only React and React DOM to 19.2.8
        shell: bash
        run: |
          set -euo pipefail
          cp package.json "$RUNNER_TEMP/package-before.json"
          cp package-lock.json "$RUNNER_TEMP/lock-before.json"

          node <<'NODE'
          const fs = require('node:fs');
          const manifest = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          if (manifest.dependencies?.react !== '19.2.4' || manifest.dependencies?.['react-dom'] !== '19.2.4') {
            throw new Error('unexpected_react_starting_version');
          }
          if (manifest.dependencies?.next !== '16.2.11') throw new Error('unexpected_next_version');
          manifest.dependencies.react = '19.2.8';
          manifest.dependencies['react-dom'] = '19.2.8';
          fs.writeFileSync('package.json', JSON.stringify(manifest, null, 2) + '\n');
          NODE

          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          git diff --check
          test -z "$(git diff --name-only -- . ':!package.json' ':!package-lock.json')"

          BEFORE="$RUNNER_TEMP/lock-before.json" AFTER="package-lock.json" node <<'NODE'
          const fs = require('node:fs');
          const before = JSON.parse(fs.readFileSync(process.env.BEFORE, 'utf8'));
          const after = JSON.parse(fs.readFileSync(process.env.AFTER, 'utf8'));
          const beforePackages = before.packages || {};
          const afterPackages = after.packages || {};
          const keys = [...new Set([...Object.keys(beforePackages), ...Object.keys(afterPackages)])].sort();
          const changed = keys.filter((key) => JSON.stringify(beforePackages[key]) !== JSON.stringify(afterPackages[key]));
          const allowed = new Set([
            '',
            'node_modules/@types/react',
            'node_modules/fsevents',
            'node_modules/react',
            'node_modules/react-dom',
          ]);
          const unexpected = changed.filter((key) => !allowed.has(key));
          if (unexpected.length) throw new Error(`unexpected_lockfile_package_changes:${unexpected.join(',')}`);
          const required = ['node_modules/react', 'node_modules/react-dom'];
          for (const key of required) {
            if (!changed.includes(key)) throw new Error(`required_lockfile_change_missing:${key}`);
          }
          const root = afterPackages[''] || {};
          if (root.dependencies?.react !== '19.2.8' || root.dependencies?.['react-dom'] !== '19.2.8') {
            throw new Error('root_lock_dependencies_invalid');
          }
          if (afterPackages['node_modules/react']?.version !== '19.2.8') throw new Error('react_lock_version_invalid');
          if (afterPackages['node_modules/react-dom']?.version !== '19.2.8') throw new Error('react_dom_lock_version_invalid');
          if (afterPackages['node_modules/react-dom']?.peerDependencies?.react !== '^19.2.8') {
            throw new Error('react_dom_peer_contract_invalid');
          }
          if (afterPackages['node_modules/next']?.version !== beforePackages['node_modules/next']?.version) {
            throw new Error('next_lock_changed');
          }
          console.log(`LOCKFILE_CHANGED_PACKAGE_COUNT=${changed.length}`);
          console.log(`LOCKFILE_CHANGED_PACKAGE_KEYS=${changed.join(',')}`);
          console.log('REACT_VERSION=19.2.8');
          console.log('REACT_DOM_VERSION=19.2.8');
          NODE

      - name: Reinstall and validate web application
        shell: bash
        run: |
          set -euo pipefail
          rm -rf node_modules
          npm ci --no-audit --no-fund
          npm run verify:truth
          npm run lint
          npm run test:operations
          npm run build

      - name: Enforce dependency audit and SBOM
        shell: bash
        run: |
          set -euo pipefail
          npm ci --prefix apps/mobile --no-audit --no-fund
          npm run security:audit -- --report react-patch-audit.json
          npm run security:sbom -- --output-dir react-patch-sbom
          node - <<'NODE'
          const fs = require('node:fs');
          const audit = JSON.parse(fs.readFileSync('react-patch-audit.json', 'utf8'));
          console.log(`ROOT_AUDIT_CRITICAL=${audit.result.root.critical}`);
          console.log(`ROOT_AUDIT_HIGH=${audit.result.root.high}`);
          console.log(`MOBILE_AUDIT_CRITICAL=${audit.result.mobile.critical}`);
          console.log(`MOBILE_AUDIT_HIGH=${audit.result.mobile.high}`);
          NODE

      - name: Commit controlled React patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git diff --cached --quiet && { echo 'No dependency changes to commit' >&2; exit 1; }
          git commit -m "Update React and React DOM to 19.2.8"
          git push origin HEAD:deps/web-react-19-2-8-20260725
